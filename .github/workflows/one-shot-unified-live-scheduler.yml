name: One-shot unified live scheduler integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-unified-live-scheduler.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply unified scheduler integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # diagnostic_flow.c: let the scheduler dispatch opaque manufacturer jobs.
          replace_once(
              'src/core/diagnostic_flow.c',
          '''static LinkDiagnosticFlowResult flow_next_live_action(
              LinkDiagnosticFlow *flow,
              uint64_t now_ms,
              LinkDiagnosticFlowAction *action)
          {
              char command[LINK_ELM327_MAX_COMMAND];
              LinkSchedulerDispatch dispatch;
              const LinkSchedulerNextResult next =
                  link_scheduler_next(&flow->scheduler, now_ms, &dispatch);
              LinkObd2Result obd2_result;

              if (next == LINK_SCHEDULER_NEXT_EMPTY ||
                  next == LINK_SCHEDULER_NEXT_PAUSED) {
                  action->kind = LINK_DIAGNOSTIC_FLOW_ACTION_READY;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
              }
              if (next == LINK_SCHEDULER_NEXT_WAITING) {
                  action->kind = LINK_DIAGNOSTIC_FLOW_ACTION_WAIT;
                  action->wait_ms = dispatch.wait_ms;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
              }
              if (next != LINK_SCHEDULER_NEXT_READY || !dispatch.pid_valid) {
                  return flow_fail_scheduler(flow, LINK_SCHEDULER_RESULT_INVALID_ARGUMENT);
              }

              obd2_result = link_obd2_build_live_pid_request(
                  dispatch.pid, command, sizeof(command));
              if (obd2_result != LINK_OBD2_RESULT_OK) {
                  return flow_fail_obd2(flow, obd2_result);
              }

              /* Reserve the slot before transmission so retries cannot over-poll a PID. */
              if (link_scheduler_mark_dispatched(&flow->scheduler, dispatch.index, now_ms) !=
                  LINK_SCHEDULER_RESULT_OK) {
                  return flow_fail_scheduler(flow, LINK_SCHEDULER_RESULT_INVALID_ARGUMENT);
              }

              flow->active_pid = dispatch.pid;
              flow->active_schedule_index = dispatch.index;
              flow->stage = LINK_DIAGNOSTIC_FLOW_READING_LIVE;
              action->pid = dispatch.pid;
              return flow_emit_command(flow, action, command, flow->config.live_timeout_ms);
          }
          ''',
          '''static LinkDiagnosticFlowResult flow_next_live_action(
              LinkDiagnosticFlow *flow,
              uint64_t now_ms,
              LinkDiagnosticFlowAction *action)
          {
              char command[LINK_ELM327_MAX_COMMAND];
              LinkSchedulerDispatch dispatch;
              const LinkSchedulerNextResult next =
                  link_scheduler_next(&flow->scheduler, now_ms, &dispatch);
              LinkObd2Result obd2_result;

              if (next == LINK_SCHEDULER_NEXT_EMPTY ||
                  next == LINK_SCHEDULER_NEXT_PAUSED) {
                  action->kind = LINK_DIAGNOSTIC_FLOW_ACTION_READY;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
              }
              if (next == LINK_SCHEDULER_NEXT_WAITING) {
                  action->kind = LINK_DIAGNOSTIC_FLOW_ACTION_WAIT;
                  action->wait_ms = dispatch.wait_ms;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
              }
              if (next != LINK_SCHEDULER_NEXT_READY) {
                  return flow_fail_scheduler(flow, LINK_SCHEDULER_RESULT_INVALID_ARGUMENT);
              }

              /* Reserve every wire slot before dispatch. Missed deadlines collapse
               * to one transaction; LINK never creates catch-up bursts. */
              if (link_scheduler_mark_dispatched(&flow->scheduler, dispatch.index, now_ms) !=
                  LINK_SCHEDULER_RESULT_OK) {
                  return flow_fail_scheduler(flow, LINK_SCHEDULER_RESULT_INVALID_ARGUMENT);
              }
              flow->active_schedule_index = dispatch.index;

              if (dispatch.kind == LINK_SCHEDULER_ITEM_EXTERNAL) {
                  if (dispatch.external_token == 0U) {
                      return flow_fail_scheduler(flow, LINK_SCHEDULER_RESULT_INVALID_ARGUMENT);
                  }
                  flow->active_manufacturer_job_token = dispatch.external_token;
                  flow->scheduled_manufacturer_job_active = true;
                  flow->stage = LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION;
                  action->kind = LINK_DIAGNOSTIC_FLOW_ACTION_SCHEDULED_MANUFACTURER_JOB;
                  action->manufacturer_job_token = dispatch.external_token;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
              }

              if (dispatch.kind != LINK_SCHEDULER_ITEM_PARAMETER ||
                  !dispatch.pid_valid) {
                  return flow_fail_scheduler(flow, LINK_SCHEDULER_RESULT_INVALID_ARGUMENT);
              }
              obd2_result = link_obd2_build_live_pid_request(
                  dispatch.pid, command, sizeof(command));
              if (obd2_result != LINK_OBD2_RESULT_OK) {
                  return flow_fail_obd2(flow, obd2_result);
              }

              flow->active_pid = dispatch.pid;
              flow->stage = LINK_DIAGNOSTIC_FLOW_READING_LIVE;
              action->pid = dispatch.pid;
              return flow_emit_command(flow, action, command, flow->config.live_timeout_ms);
          }
          ''')

          replace_once(
              'src/core/diagnostic_flow.c',
          '''    case LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION:
                  action->kind = LINK_DIAGNOSTIC_FLOW_ACTION_MANUFACTURER_EXTENSION;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
          ''',
          '''    case LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION:
                  if (flow->scheduled_manufacturer_job_active) {
                      action->kind = LINK_DIAGNOSTIC_FLOW_ACTION_NONE;
                      return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
                  }
                  action->kind = LINK_DIAGNOSTIC_FLOW_ACTION_MANUFACTURER_EXTENSION;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
          ''')

          marker = '''LinkDiagnosticFlowResult link_diagnostic_flow_recover_live_timeout(
              LinkDiagnosticFlow *flow,
              uint64_t now_ms)
          '''
          addition = '''LinkDiagnosticFlowResult link_diagnostic_flow_register_live_manufacturer_job(
              LinkDiagnosticFlow *flow,
              uint32_t token,
              uint32_t interval_ms,
              LinkSchedulerPriority priority,
              uint64_t first_due_ms)
          {
              LinkSchedulerResult result;
              if (flow == NULL || token == 0U || interval_ms == 0U) {
                  return LINK_DIAGNOSTIC_FLOW_RESULT_INVALID_ARGUMENT;
              }
              result = link_scheduler_add_external(
                  &flow->scheduler, token, interval_ms, priority, first_due_ms);
              if (result != LINK_SCHEDULER_RESULT_OK) {
                  flow->scheduler_failure = result;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_SCHEDULER_ERROR;
              }
              return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
          }

          LinkDiagnosticFlowResult link_diagnostic_flow_set_live_manufacturer_job_enabled(
              LinkDiagnosticFlow *flow,
              uint32_t token,
              bool enabled)
          {
              LinkSchedulerResult result;
              if (flow == NULL || token == 0U) {
                  return LINK_DIAGNOSTIC_FLOW_RESULT_INVALID_ARGUMENT;
              }
              result = link_scheduler_set_external_enabled(
                  &flow->scheduler, token, enabled);
              if (result != LINK_SCHEDULER_RESULT_OK) {
                  flow->scheduler_failure = result;
                  return LINK_DIAGNOSTIC_FLOW_RESULT_SCHEDULER_ERROR;
              }
              return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
          }

          ''' + marker
          replace_once('src/core/diagnostic_flow.c', marker, addition)

          replace_once(
              'src/core/diagnostic_flow.c',
          '''    flow->stage = LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION;
              return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
          }

          LinkDiagnosticFlowResult link_diagnostic_flow_resume_after_manufacturer(
          ''',
          '''    flow->scheduled_manufacturer_job_active = false;
              flow->active_manufacturer_job_token = 0U;
              flow->stage = LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION;
              return LINK_DIAGNOSTIC_FLOW_RESULT_OK;
          }

          LinkDiagnosticFlowResult link_diagnostic_flow_resume_after_manufacturer(
          ''')

          replace_once(
              'src/core/diagnostic_flow.c',
          '''    if (flow->stage != LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION ||
                  flow->awaiting_response) {
                  return LINK_DIAGNOSTIC_FLOW_RESULT_INVALID_STATE;
              }

              if (flow->config.restore_adapter_after_manufacturer_extension) {
          ''',
          '''    if (flow->stage != LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION ||
                  flow->awaiting_response) {
                  return LINK_DIAGNOSTIC_FLOW_RESULT_INVALID_STATE;
              }

              flow->scheduled_manufacturer_job_active = false;
              flow->active_manufacturer_job_token = 0U;
              if (flow->config.restore_adapter_after_manufacturer_extension) {
          ''')

          # Apple bridge: expose registration and a distinct scheduled callback.
          replace_once(
              'platform/apple/LinkDiagnosticsController.h',
          '''- (void)linkDiagnosticsControllerBeginManufacturerExtension:
              (LinkDiagnosticsController *)controller;
          - (void)linkDiagnosticsController:(LinkDiagnosticsController *)controller
            didReceiveManufacturerResponse:(const LinkElm327Response *)response;
          ''',
          '''- (void)linkDiagnosticsControllerBeginManufacturerExtension:
              (LinkDiagnosticsController *)controller;
          - (void)linkDiagnosticsController:(LinkDiagnosticsController *)controller
            beginScheduledManufacturerJob:(uint32_t)token;
          - (void)linkDiagnosticsController:(LinkDiagnosticsController *)controller
            didReceiveManufacturerResponse:(const LinkElm327Response *)response;
          ''')

          replace_once(
              'platform/apple/LinkDiagnosticsController.h',
          '''- (BOOL)beginLiveManufacturerExtension;
          - (BOOL)beginManufacturerCommand:(const char *)command
                                   timeout:(uint64_t)timeoutMs;
          ''',
          '''- (BOOL)beginLiveManufacturerExtension;
          /** Register an opaque recurring manufacturer transaction on LINK's single wire queue. */
          - (BOOL)registerLiveManufacturerJobWithToken:(uint32_t)token
                                  intervalMilliseconds:(uint32_t)intervalMs
                                              priority:(LinkSchedulerPriority)priority;
          - (BOOL)setLiveManufacturerJobEnabled:(BOOL)enabled token:(uint32_t)token;
          - (BOOL)beginManufacturerCommand:(const char *)command
                                   timeout:(uint64_t)timeoutMs;
          ''')

          replace_once(
              'platform/apple/LinkDiagnosticsController.m',
          '''- (BOOL)beginManufacturerCommand:(const char *)command
                                   timeout:(uint64_t)timeoutMs
          {
          ''',
          '''- (BOOL)registerLiveManufacturerJobWithToken:(uint32_t)token
                                  intervalMilliseconds:(uint32_t)intervalMs
                                              priority:(LinkSchedulerPriority)priority
          {
              if (!_sessionInitialized || !self.active || token == 0U || intervalMs == 0U)
                  return NO;
              const LinkDiagnosticFlowResult result =
                  link_diagnostic_flow_register_live_manufacturer_job(
                      &_flow, token, intervalMs, priority,
                      LinkAppleMonotonicMilliseconds() + (uint64_t)intervalMs);
              if (result != LINK_DIAGNOSTIC_FLOW_RESULT_OK) return NO;
              [self driveDiagnosticFlow];
              return YES;
          }

          - (BOOL)setLiveManufacturerJobEnabled:(BOOL)enabled token:(uint32_t)token
          {
              if (token == 0U) return NO;
              const LinkDiagnosticFlowResult result =
                  link_diagnostic_flow_set_live_manufacturer_job_enabled(
                      &_flow, token, enabled ? true : false);
              if (result != LINK_DIAGNOSTIC_FLOW_RESULT_OK) return NO;
              if (enabled && self.active && !_flow.awaiting_response &&
                  !_manufacturerExtensionActive) {
                  [self driveDiagnosticFlow];
              }
              return YES;
          }

          - (BOOL)beginManufacturerCommand:(const char *)command
                                   timeout:(uint64_t)timeoutMs
          {
          ''')

          replace_once(
              'platform/apple/LinkDiagnosticsController.m',
          '''    case LINK_DIAGNOSTIC_FLOW_ACTION_MANUFACTURER_EXTENSION: {
                  id<LinkDiagnosticsControllerDelegate> delegate = self.delegate;
                  if (![delegate respondsToSelector:
                          @selector(linkDiagnosticsControllerBeginManufacturerExtension:)]) {
                      [self failWithStatus:
                          @"Manufacturer extension requested without a product handler"];
                      return;
                  }
                  _manufacturerExtensionActive = YES;
                  [delegate linkDiagnosticsControllerBeginManufacturerExtension:self];
                  return;
              }

              case LINK_DIAGNOSTIC_FLOW_ACTION_READY:
          ''',
          '''    case LINK_DIAGNOSTIC_FLOW_ACTION_MANUFACTURER_EXTENSION: {
                  id<LinkDiagnosticsControllerDelegate> delegate = self.delegate;
                  if (![delegate respondsToSelector:
                          @selector(linkDiagnosticsControllerBeginManufacturerExtension:)]) {
                      [self failWithStatus:
                          @"Manufacturer extension requested without a product handler"];
                      return;
                  }
                  _manufacturerExtensionActive = YES;
                  [delegate linkDiagnosticsControllerBeginManufacturerExtension:self];
                  return;
              }

              case LINK_DIAGNOSTIC_FLOW_ACTION_SCHEDULED_MANUFACTURER_JOB: {
                  id<LinkDiagnosticsControllerDelegate> delegate = self.delegate;
                  if (action.manufacturer_job_token == 0U ||
                      ![delegate respondsToSelector:
                          @selector(linkDiagnosticsController:beginScheduledManufacturerJob:)]) {
                      [self failWithStatus:
                          @"Scheduled manufacturer job has no product handler"];
                      return;
                  }
                  ++_pollGeneration;
                  _manufacturerExtensionActive = YES;
                  [delegate linkDiagnosticsController:self
                      beginScheduledManufacturerJob:action.manufacturer_job_token];
                  return;
              }

              case LINK_DIAGNOSTIC_FLOW_ACTION_READY:
          ''')

          # Runtime scheduler regression: external work shares/preserves the queue.
          replace_once(
              'tests/test_runtime.c',
          '''    link_scheduler_init(&scheduler);
              CHECK(link_scheduler_add(&scheduler, 0x0cU, 250U, LINK_SCHEDULER_PRIORITY_CRITICAL, 100U) == LINK_SCHEDULER_RESULT_OK);
          ''',
          '''    {
                  LinkScheduler unified;
                  LinkSchedulerDispatch unified_dispatch;
                  link_scheduler_init(&unified);
                  CHECK(link_scheduler_add(&unified, 0x0cU, 250U,
                            LINK_SCHEDULER_PRIORITY_CRITICAL, 100U) ==
                        LINK_SCHEDULER_RESULT_OK);
                  CHECK(link_scheduler_add_external(&unified, UINT32_C(0x4d420001),
                            750U, LINK_SCHEDULER_PRIORITY_HIGH, 50U) ==
                        LINK_SCHEDULER_RESULT_OK);
                  CHECK(link_scheduler_next(&unified, 50U, &unified_dispatch) ==
                        LINK_SCHEDULER_NEXT_READY);
                  CHECK(unified_dispatch.kind == LINK_SCHEDULER_ITEM_EXTERNAL);
                  CHECK(unified_dispatch.external_token == UINT32_C(0x4d420001));
                  CHECK(link_scheduler_mark_dispatched(
                            &unified, unified_dispatch.index, 50U) ==
                        LINK_SCHEDULER_RESULT_OK);
                  CHECK(link_scheduler_set_external_enabled(
                            &unified, UINT32_C(0x4d420001), false) ==
                        LINK_SCHEDULER_RESULT_OK);
              }

              link_scheduler_init(&scheduler);
              CHECK(link_scheduler_add(&scheduler, 0x0cU, 250U, LINK_SCHEDULER_PRIORITY_CRITICAL, 100U) == LINK_SCHEDULER_RESULT_OK);
          ''')

          # Flow regression: scheduled product work is selected by LINK and then resumes OBD.
          marker = '''static int test_fault_scan_presentation_state(void)
          '''
          scheduled_test = '''static int test_scheduled_manufacturer_job(void)
          {
              LinkDiagnosticFlow flow;
              LinkDiagnosticFlowConfig config = LINK_DIAGNOSTIC_FLOW_CONFIG_INIT;
              LinkDiagnosticFlowAction action;

              CHECK(link_diagnostic_flow_init(&flow, &config) ==
                    LINK_DIAGNOSTIC_FLOW_RESULT_OK);
              flow.standard_diagnostic_context_complete = true;
              flow.stage = LINK_DIAGNOSTIC_FLOW_LIVE;
              CHECK(link_scheduler_add(
                        &flow.scheduler, UINT8_C(0x0c), 500U,
                        LINK_SCHEDULER_PRIORITY_CRITICAL, 100U) ==
                    LINK_SCHEDULER_RESULT_OK);
              CHECK(link_diagnostic_flow_register_live_manufacturer_job(
                        &flow, UINT32_C(0x4d420001), 750U,
                        LINK_SCHEDULER_PRIORITY_HIGH, 50U) ==
                    LINK_DIAGNOSTIC_FLOW_RESULT_OK);

              CHECK(link_diagnostic_flow_next_action(&flow, 50U, &action) ==
                    LINK_DIAGNOSTIC_FLOW_RESULT_OK);
              CHECK(action.kind ==
                    LINK_DIAGNOSTIC_FLOW_ACTION_SCHEDULED_MANUFACTURER_JOB);
              CHECK(action.manufacturer_job_token == UINT32_C(0x4d420001));
              CHECK(flow.stage == LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION);
              CHECK(flow.scheduled_manufacturer_job_active);

              CHECK(link_diagnostic_flow_resume_after_manufacturer(&flow) ==
                    LINK_DIAGNOSTIC_FLOW_RESULT_OK);
              CHECK(flow.stage == LINK_DIAGNOSTIC_FLOW_LIVE);
              CHECK(!flow.scheduled_manufacturer_job_active);

              CHECK(link_diagnostic_flow_next_action(&flow, 100U, &action) ==
                    LINK_DIAGNOSTIC_FLOW_RESULT_OK);
              CHECK(action.kind == LINK_DIAGNOSTIC_FLOW_ACTION_SEND_COMMAND);
              CHECK(strcmp(action.command, "010C") == 0);
              return 0;
          }


          ''' + marker
          replace_once('tests/test_diagnostic_flow.c', marker, scheduled_test)
          replace_once(
              'tests/test_diagnostic_flow.c',
          '''int main(void)
          {
              if (test_fault_scan_presentation_state() != 0) return 1;
          ''',
          '''int main(void)
          {
              if (test_scheduled_manufacturer_job() != 0) return 1;
              if (test_fault_scan_presentation_state() != 0) return 1;
          ''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/diagnostic_flow.c platform/apple/LinkDiagnosticsController.h platform/apple/LinkDiagnosticsController.m tests/test_runtime.c tests/test_diagnostic_flow.c
          git rm .github/workflows/one-shot-unified-live-scheduler.yml
          git commit -m "Unify standard and manufacturer live scheduling"
          git push origin HEAD:main
