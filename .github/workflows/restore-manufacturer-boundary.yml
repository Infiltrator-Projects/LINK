name: Restore manufacturer boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-manufacturer-boundary.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply boundary migration
        run: python3 .github/scripts/restore_manufacturer_boundary.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e include/link/mercedes_me_data_ids.h
          test ! -e include/link/mercedes_me_diaglogic.h
          test ! -e include/link/mercedes_me_whisper.h
          test ! -e src/core/mercedes_me_data_ids.c
          test ! -e src/core/mercedes_me_diaglogic.c
          test ! -e src/core/mercedes_me_whisper.c
          test ! -e docs/MERCEDES-ME-DATA-IDS.md
          grep -Fq 'Mercedes application semantics recovered from DataIds, DiagLogic and Whisper are owned and compiled by MBLINK, not LINK.' README.md

      - name: Publish tested boundary restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git commit -m "Restore LINK manufacturer boundary"
          git push origin HEAD:main
