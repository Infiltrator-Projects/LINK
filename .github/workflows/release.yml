# SPDX-License-Identifier: GPL-3.0-or-later
name: LINK Release

on:
  workflow_run:
    workflows: ["LINK CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release commit from main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - id: release
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse origin/main)"
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          subject="$(git log -1 --format=%s "$head_commit")"
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            echo "Release commit subject must begin with Release ${version}." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build source release
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/LINK-${VERSION}"
          mkdir -p "$staging" release-assets
          rsync -a --exclude='.git' --exclude='release-assets' ./ "$staging/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/release-assets/LINK-${VERSION}-source.zip" "LINK-${VERSION}")
          (cd release-assets && sha256sum "LINK-${VERSION}-source.zip" > SHA256SUMS.txt)
          test -s "release-assets/LINK-${VERSION}-source.zip"
          test -s release-assets/SHA256SUMS.txt

      - name: Stage complete draft and publish immutable release
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse origin/main)"
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Release tag $TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          release_state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' \
            2>/dev/null || true)"
          if [[ -n "$release_state" ]]; then
            IFS=$'\t' read -r is_draft target_commitish <<<"$release_state"
            if [[ "$is_draft" != "true" || "$target_commitish" != "$head_commit" ]]; then
              echo "Release $TAG already exists; published releases are immutable." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$head_commit" --draft \
              --title "LINK $VERSION" \
              --notes "LINK $VERSION: automatic release from tested current main."
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq "LINK-${VERSION}-source.zip" <<<"$assets"
          grep -Fxq "SHA256SUMS.txt" <<<"$assets"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$head_commit"

      - name: Verify published assets
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq "LINK-${VERSION}-source.zip" <<<"$assets"
          grep -Fxq "SHA256SUMS.txt" <<<"$assets"
