# SPDX-License-Identifier: GPL-3.0-or-later
name: LINK Release
on:
  workflow_run:
    workflows: ["LINK CI"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: link-source-${{ github.event.workflow_run.head_sha }}
          path: release
      - name: Publish the qualified source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          test "$head_commit" = "$EXPECTED_SHA"
          if [[ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]]; then
            echo "A newer main superseded this candidate."
            exit 0
          fi
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "#define LINK_VERSION_STRING \"$version\"" include/link/version.h
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null &&
             [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$head_commit" ]]; then
            echo "$tag already identifies an immutable earlier release."
            exit 0
          fi
          test "$(cat release/SOURCE_COMMIT)" = "$EXPECTED_SHA"
          (cd release && sha256sum -c SHA256SUMS.txt)
          notes="$RUNNER_TEMP/release-notes.md"
          git log -1 --format=%B "$head_commit" > "$notes"
          state=$(gh release view "$tag" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish] | @tsv' 2>/dev/null || true)
          if [[ -z "$state" ]]; then
            gh release create "$tag" --target "$head_commit" --draft \
              --title "LINK $version" --notes-file "$notes"
            draft=true
          else
            IFS=$'\t' read -r draft target <<<"$state"
            if [[ "$draft" == true ]]; then
              test "$target" = "$head_commit"
            else
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$head_commit"
            fi
          fi
          # Only draft assets may change; published releases are immutable.
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" release/* --clobber
          fi
          verify_remote() {
            local destination
            destination=$(mktemp -d)
            gh release download "$tag" --dir "$destination"
            diff -qr release "$destination"
            rm -rf "$destination"
          }
          verify_remote
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false --latest
          fi
          verify_remote
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$head_commit"
