# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply explicit adapter targeting

on:
  push:
    branches:
      - adapter-targeting

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply patch when explicitly triggered
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "apply adapter targeting" || exit 0
          python3 tools/apply_adapter_targeting.py
          git diff --check
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add platform/apple/LinkBLETransport.h platform/apple/LinkBLETransport.m platform/apple/LinkDiagnosticsController.h platform/apple/LinkDiagnosticsController.m
          git commit -m "apple: allow explicit BLE adapter targeting"
          git push origin HEAD:adapter-targeting
