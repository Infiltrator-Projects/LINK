name: One-shot branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-redundant-branches:
    runs-on: ubuntu-latest
    if: github.repository == 'Infiltrator-Projects/LINK' && github.ref == 'refs/heads/main'
    steps:
      - name: Delete inspected redundant branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'adapter-targeting'
            'document-mblink-stm32-ownership'
            'fix/simulator-readiness-flow'
            'fix-stm32c0-tx-event-hal'
            'fix-stm32c092-explicit-tester-role'
            'hal-protocol-reporting'
            'issue-38-keil-server-completion'
            'issue-38-stm32-read-dtc'
            'release/0.14.97'
            'stm32-uds-server'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting inspected redundant branch: ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
