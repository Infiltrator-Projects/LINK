# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL quick-five boundary migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Fix quick-five boundary migration helper'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply shared ownership migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          exec(base64.b64decode(""))
          PY
          grep -Fq 'LinkDiagnosticConnectionPhase connectionPhase' platform/apple/LinkDiagnosticsController.h
          grep -Fq 'existing[@"liveResponders"]' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'enum LinkStandardPIDConfiguration' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'enum LinkEvidenceExport' platform/apple/LinkDiagnosticUI.swift
      - name: Validate portable core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Commit migration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HAL migration'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/hal-quick5-boundary-migration.yml
          git add platform/apple/LinkDiagnosticsController.h platform/apple/LinkDiagnosticsController.m platform/apple/LinkDiagnosticUI.swift .github/workflows/ci.yml
          git commit -m 'Move five small product boundaries into LINK'
          git push origin HEAD:main
