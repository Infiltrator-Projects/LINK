name: HAL quick-five boundary migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Retry quick-five boundary migration helper'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply small LINK ownership migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count}, found {actual}")
              p.write_text(text.replace(old, new, count))

          h = 'platform/apple/LinkDiagnosticsController.h'
          replace(h, '- (NSArray<NSNumber *> *)displayRecentValuesForPID:(uint8_t)pid\n                                             limit:(NSUInteger)limit;\n- (NSString *)displayUnitForPID:(uint8_t)pid;\n- (NSArray<NSNumber *> *)displayRangeForPID:(uint8_t)pid;', '- (double)displayValueForPID:(uint8_t)pid canonicalValue:(double)value;\n- (double)displayTemperatureCelsius:(double)celsius;\n- (NSString *)displayTemperatureUnit;\n- (NSArray<NSNumber *> *)displayRecentValuesForPID:(uint8_t)pid\n                                             limit:(NSUInteger)limit;\n- (NSString *)displayUnitForPID:(uint8_t)pid;\n- (NSArray<NSNumber *> *)displayRangeForPID:(uint8_t)pid;')
          replace(h, '- (BOOL)favouriteForPID:(uint8_t)pid;\n- (void)setFavourite:(BOOL)favourite forPID:(uint8_t)pid;', '- (BOOL)supportsPID:(uint8_t)pid;\n- (BOOL)favouriteForPID:(uint8_t)pid;\n- (void)setFavourite:(BOOL)favourite forPID:(uint8_t)pid;')

          m = 'platform/apple/LinkDiagnosticsController.m'
          marker = '- (NSArray<NSNumber *> *)displayRecentValuesForPID:(uint8_t)pid\n                                             limit:(NSUInteger)limit\n'
          methods = ''.join([
              '- (double)displayValueForPID:(uint8_t)pid canonicalValue:(double)value\n',
              '{\n',
              '    LinkObd2UnitCode unit = LINK_OBD2_UNIT_NONE;\n',
              '    double display = value;\n',
              '    const char *label = "";\n',
              '    if (link_parameter_obd2_expected_unit(pid, &unit) &&\n',
              '        link_units_convert_obd2(unit, value, [self resolvedMeasurementSystem],\n',
              '            &display, &label))\n',
              '        return display;\n',
              '    return value;\n',
              '}\n\n',
              '- (double)displayTemperatureCelsius:(double)celsius\n',
              '{\n',
              '    double display = celsius;\n',
              '    const char *label = "°C";\n',
              '    if (link_units_convert_obd2(LINK_OBD2_UNIT_CELSIUS, celsius,\n',
              '            [self resolvedMeasurementSystem], &display, &label))\n',
              '        return display;\n',
              '    return celsius;\n',
              '}\n\n',
              '- (NSString *)displayTemperatureUnit\n',
              '{\n',
              '    double ignored = 0.0;\n',
              '    const char *label = "°C";\n',
              '    (void)link_units_convert_obd2(LINK_OBD2_UNIT_CELSIUS, 0.0,\n',
              '        [self resolvedMeasurementSystem], &ignored, &label);\n',
              '    return label != NULL ? [NSString stringWithUTF8String:label] : @"°C";\n',
              '}\n\n'])
          replace(m, marker, methods + marker)
          replace(m, '- (BOOL)favouriteForPID:(uint8_t)pid\n{\n    return link_telemetry_store_is_favourite(&_telemetry, pid);\n}', '- (BOOL)supportsPID:(uint8_t)pid\n{\n    return link_obd2_pid_set_contains(&_flow.supported_pids, pid);\n}\n\n- (BOOL)favouriteForPID:(uint8_t)pid\n{\n    return link_telemetry_store_is_favourite(&_telemetry, pid);\n}')
          replace(m, '    NSMutableDictionary *stored = [profile mutableCopy];\n    stored[@"vin"] = vin;\n    if (![stored[@"updatedAt"] isKindOfClass:[NSNumber class]]) {\n        stored[@"updatedAt"] = @([[NSDate date] timeIntervalSince1970]);\n    }\n\n    NSString *identifier = [self associatedAdapterIdentifierForVIN:vin];', '    NSMutableDictionary *stored = [profile mutableCopy];\n    stored[@"vin"] = vin;\n    if (![stored[@"updatedAt"] isKindOfClass:[NSNumber class]]) {\n        stored[@"updatedAt"] = @([[NSDate date] timeIntervalSince1970]);\n    }\n\n    /* Preserve LINK-owned standard responder capability across product saves. */\n    NSDictionary *existing = [self profileForVIN:vin];\n    NSArray *responders = [existing[@"liveResponders"] isKindOfClass:[NSArray class]]\n        ? existing[@"liveResponders"] : nil;\n    if (stored[@"liveResponders"] == nil && responders != nil)\n        stored[@"liveResponders"] = responders;\n\n    NSString *identifier = [self associatedAdapterIdentifierForVIN:vin];')

          ui = Path('platform/apple/LinkDiagnosticUI.swift')
          text = ui.read_text()
          marker = 'struct LinkPIDConfigurationItem: Identifiable {\n    let id: String\n    let pid: UInt8\n    let shortName: String\n    let title: String\n    let pollingEnabled: Bool\n    let favourite: Bool\n    let advertised: Bool\n}\n'
          if text.count(marker) != 1:
              raise SystemExit('LinkDiagnosticUI.swift marker mismatch')
          helper = '\n'.join([
              '', 'enum LinkEvidenceExport {',
              '    static func prepareTemporaryCSV(_ data: Data, productName: String) async throws -> URL {',
              '        let filename = "\\(productName)-diagnostic-evidence-\\(UUID().uuidString).csv"',
              '        let url = FileManager.default.temporaryDirectory.appendingPathComponent(filename)',
              '        do {',
              '            try await Task.detached(priority: .utility) {',
              '                try data.write(to: url, options: .atomic)',
              '            }.value',
              '            return url',
              '        } catch {',
              '            try? FileManager.default.removeItem(at: url)',
              '            throw error',
              '        }',
              '    }', '',
              '    static func removeTemporaryFile(_ url: URL?) {',
              '        guard let url else { return }',
              '        try? FileManager.default.removeItem(at: url)',
              '    }', '}', ''])
          ui.write_text(text.replace(marker, marker + helper, 1))

          ci = '.github/workflows/ci.yml'
          replace(ci, "          grep -Fq 'link_telemetry_recorder_begin(' platform/apple/LinkDiagnosticsController.m\n          grep -Fq '\"BLE\", stateName.UTF8String' platform/apple/LinkDiagnosticsController.m", "          grep -Fq 'link_telemetry_recorder_begin(' platform/apple/LinkDiagnosticsController.m\n          grep -Fq 'link_uds_standard_service_count' src/uds/uds_services.c\n          grep -Fq 'link_elm327_parser_feed' src/elm327/elm327.c\n          grep -Fq 'link_elm327_can_decode_pdu' src/elm327/can.c\n          grep -Fq 'link_elm327_session_begin' src/elm327/session.c\n          grep -Fq 'link_obd2_decode_live_pid' src/obd2/obd2.c\n          grep -Fq 'link_uds_decode_response' src/uds/uds.c\n          grep -Fq 'link_diagnostic_flow_next_action' src/core/diagnostic_flow.c\n          grep -Fq 'link_diagnostic_flow_accept_response' platform/apple/LinkDiagnosticsController.m\n          grep -Fq 'link_diagnostic_flow_resume_after_manufacturer' platform/apple/LinkDiagnosticsController.m\n          grep -Fq 'link_obd2_is_negative_response' src/core/diagnostic_flow.c\n          grep -Fq '\"BLE\", stateName.UTF8String' platform/apple/LinkDiagnosticsController.m")
          PY
          grep -Fq 'displayValueForPID' platform/apple/LinkDiagnosticsController.h
          grep -Fq 'supportsPID' platform/apple/LinkDiagnosticsController.h
          grep -Fq 'Preserve LINK-owned standard responder capability' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'enum LinkEvidenceExport' platform/apple/LinkDiagnosticUI.swift
      - name: Validate portable core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Commit migration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HAL migration'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/hal-quick5-boundary-migration.yml
          git add platform/apple/LinkDiagnosticsController.h platform/apple/LinkDiagnosticsController.m platform/apple/LinkDiagnosticUI.swift .github/workflows/ci.yml
          git commit -m 'Centralise five small Apple product boundaries'
          git push origin HEAD:main
