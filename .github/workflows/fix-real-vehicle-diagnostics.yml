name: Temporary real-vehicle diagnostics repair

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-real-vehicle-diagnostics.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Apply real-vehicle fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # 1. ELM-managed CAN: accept the common UDS ResponsePending + final-response
          #    form that real ELM327-class adapters return as two ordinary lines.
          p = Path('src/elm327/can.c')
          s = p.read_text()
          marker = '''const char *link_elm327_can_result_name(LinkElm327CanResult result)\n'''
          helper = r'''static LinkElm327CanResult elm327_can_decode_unindexed(
    const LinkElm327Response *response,
    uint8_t *temporary,
    size_t temporary_size,
    size_t *decoded_length)
{
    const char *cursor;
    bool pending_seen = false;
    bool final_seen = false;
    uint8_t pending_service = 0U;

    if (response == NULL || temporary == NULL || decoded_length == NULL) {
        return LINK_ELM327_CAN_RESULT_INVALID_ARGUMENT;
    }
    *decoded_length = 0U;
    cursor = response->text;
    while (*cursor != '\0') {
        const char *end = strchr(cursor, '\n');
        const size_t line_length = end == NULL ? strlen(cursor)
                                                : (size_t)(end - cursor);
        size_t first = 0U;
        size_t last = line_length;
        uint8_t line_bytes[ELM327_CAN_MAX_DECODED_PDU];
        size_t line_byte_count = 0U;
        LinkElm327CanResult result;

        while (first < last && elm327_can_space(cursor[first])) first++;
        while (last > first && elm327_can_space(cursor[last - 1U])) last--;
        if (first != last) {
            result = elm327_can_parse_hex_line(
                cursor + first, last - first,
                line_bytes, sizeof(line_bytes), &line_byte_count);
            if (result != LINK_ELM327_CAN_RESULT_OK) return result;

            if (line_byte_count == 3U && line_bytes[0] == 0x7fU &&
                line_bytes[2] == 0x78U && !final_seen) {
                if (pending_seen && pending_service != line_bytes[1])
                    return LINK_ELM327_CAN_RESULT_UNEXPECTED_RESPONSE;
                pending_seen = true;
                pending_service = line_bytes[1];
            } else {
                if (final_seen) return LINK_ELM327_CAN_RESULT_UNEXPECTED_RESPONSE;
                if (pending_seen) {
                    const bool matching_positive =
                        line_bytes[0] == (uint8_t)(pending_service + 0x40U);
                    const bool matching_negative = line_byte_count >= 3U &&
                        line_bytes[0] == 0x7fU && line_bytes[1] == pending_service;
                    if (!matching_positive && !matching_negative)
                        return LINK_ELM327_CAN_RESULT_UNEXPECTED_RESPONSE;
                }
                if (line_byte_count > temporary_size)
                    return LINK_ELM327_CAN_RESULT_PDU_TOO_LARGE;
                memcpy(temporary, line_bytes, line_byte_count);
                *decoded_length = line_byte_count;
                final_seen = true;
            }
        }
        if (end == NULL) break;
        cursor = end + 1;
    }

    return final_seen ? LINK_ELM327_CAN_RESULT_OK
                      : LINK_ELM327_CAN_RESULT_UNEXPECTED_RESPONSE;
}

'''
          if helper not in s:
              if marker not in s: raise SystemExit('CAN helper insertion point missing')
              s = s.replace(marker, helper + marker, 1)
          old = '''    if (!indexed) {\n        const char *newline = strchr(response->text, '\\n');\n        if (newline != NULL && newline[1] != '\\0') {\n            return LINK_ELM327_CAN_RESULT_UNEXPECTED_RESPONSE;\n        }\n        result = elm327_can_parse_hex_line(\n            response->text,\n            newline == NULL ? strlen(response->text)\n                            : (size_t)(newline - response->text),\n            temporary, sizeof(temporary), &decoded_length);\n        if (result != LINK_ELM327_CAN_RESULT_OK) {\n            return result;\n        }\n    }\n'''
          new = '''    if (!indexed) {\n        result = elm327_can_decode_unindexed(\n            response, temporary, sizeof(temporary), &decoded_length);\n        if (result != LINK_ELM327_CAN_RESULT_OK) {\n            return result;\n        }\n    }\n'''
          if old not in s: raise SystemExit('old unindexed decoder block missing')
          p.write_text(s.replace(old, new, 1))

          # 2. A UDS negative TesterPresent is still positive evidence that an ECU
          #    is present. Continue with read-only identification instead of killing
          #    the whole generic ECU probe.
          replace('src/discover/ecu_probe.c',
          '''    if (uds_result != LINK_UDS_RESULT_OK) {\n        probe->uds_failure = uds_result;\n        if (uds_result == LINK_UDS_RESULT_NEGATIVE_RESPONSE) {\n            link_ecu_probe_record_negative_response(\n                LINK_UDS_SERVICE_TESTER_PRESENT,\n                pdu, pdu_length, &probe->uds_negative_response_code);\n        }\n        return link_ecu_probe_fail(probe, LINK_ECU_PROBE_RESULT_UDS_ERROR);\n    }\n    return link_ecu_probe_begin_reads(probe);\n''',
          '''    if (uds_result == LINK_UDS_RESULT_NEGATIVE_RESPONSE) {\n        probe->uds_failure = uds_result;\n        link_ecu_probe_record_negative_response(\n            LINK_UDS_SERVICE_TESTER_PRESENT,\n            pdu, pdu_length, &probe->uds_negative_response_code);\n        return link_ecu_probe_begin_reads(probe);\n    }\n    if (uds_result != LINK_UDS_RESULT_OK) {\n        probe->uds_failure = uds_result;\n        return link_ecu_probe_fail(probe, LINK_ECU_PROBE_RESULT_UDS_ERROR);\n    }\n    return link_ecu_probe_begin_reads(probe);\n''')

          # 3. Allow products to run their manufacturer extension after the fast,
          #    legislated SAE DTC inventory instead of blocking it.
          replace('include/link/diagnostic_flow.h',
          '''    bool manufacturer_extension_after_pid_discovery;\n    bool restore_adapter_after_manufacturer_extension;\n''',
          '''    bool manufacturer_extension_after_pid_discovery;\n    bool manufacturer_extension_after_standard_dtcs;\n    bool restore_adapter_after_manufacturer_extension;\n''')
          replace('include/link/diagnostic_flow.h',
          '''        .manufacturer_extension_after_pid_discovery = false, \\\n        .restore_adapter_after_manufacturer_extension = false, \\\n''',
          '''        .manufacturer_extension_after_pid_discovery = false, \\\n        .manufacturer_extension_after_standard_dtcs = false, \\\n        .restore_adapter_after_manufacturer_extension = false, \\\n''')
          replace('include/link/diagnostic_flow.h',
          '''    uint8_t active_pid;\n    bool awaiting_response;\n''',
          '''    uint8_t active_pid;\n    bool awaiting_response;\n    bool standard_dtc_inventory_complete;\n''')

          replace('src/core/diagnostic_flow.c',
          '''            if (stage == LINK_DIAGNOSTIC_FLOW_RESTORING_AFTER_MANUFACTURER) {\n                flow->stage = LINK_DIAGNOSTIC_FLOW_SCANNING_STORED_DTCS;\n            } else {\n''',
          '''            if (stage == LINK_DIAGNOSTIC_FLOW_RESTORING_AFTER_MANUFACTURER) {\n                flow->stage = flow->standard_dtc_inventory_complete\n                    ? LINK_DIAGNOSTIC_FLOW_LIVE\n                    : LINK_DIAGNOSTIC_FLOW_SCANNING_STORED_DTCS;\n            } else {\n''')
          old = '''        if (kind == LINK_OBD2_DTC_PERMANENT) {\n            LinkSchedulerResult schedule_result =\n                link_scheduler_configure_standard_obd2_bits(\n                    &flow->scheduler,\n                    flow->supported_pids.bits,\n                    now_ms);\n            if (schedule_result != LINK_SCHEDULER_RESULT_OK) {\n                return flow_fail_scheduler(flow, schedule_result);\n            }\n            event->became_ready = true;\n        }\n'''
          new = '''        if (kind == LINK_OBD2_DTC_PERMANENT) {\n            LinkSchedulerResult schedule_result =\n                link_scheduler_configure_standard_obd2_bits(\n                    &flow->scheduler,\n                    flow->supported_pids.bits,\n                    now_ms);\n            if (schedule_result != LINK_SCHEDULER_RESULT_OK) {\n                return flow_fail_scheduler(flow, schedule_result);\n            }\n            flow->standard_dtc_inventory_complete = true;\n            if (flow->config.manufacturer_extension_after_standard_dtcs) {\n                flow->stage = LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION;\n                event->became_ready = false;\n            } else {\n                event->became_ready = true;\n            }\n        }\n'''
          replace('src/core/diagnostic_flow.c', old, new)
          replace('src/core/diagnostic_flow.c',
          '''    if (flow->config.restore_adapter_after_manufacturer_extension) {\n        link_elm327_init_begin(&flow->initialization);\n        flow->stage = LINK_DIAGNOSTIC_FLOW_RESTORING_AFTER_MANUFACTURER;\n    } else {\n        flow->stage = LINK_DIAGNOSTIC_FLOW_SCANNING_STORED_DTCS;\n    }\n''',
          '''    if (flow->config.restore_adapter_after_manufacturer_extension) {\n        link_elm327_init_begin(&flow->initialization);\n        flow->stage = LINK_DIAGNOSTIC_FLOW_RESTORING_AFTER_MANUFACTURER;\n    } else {\n        flow->stage = flow->standard_dtc_inventory_complete\n            ? LINK_DIAGNOSTIC_FLOW_LIVE\n            : LINK_DIAGNOSTIC_FLOW_SCANNING_STORED_DTCS;\n    }\n''')

          # 4. Structured product state hook for session evidence.
          replace('platform/linux/link-gtk-shell.h',
          '''    void (*diagnostic_changed)(const LinkDiagnosticFlow *flow,\n                               const LinkDiagnosticFlowEvent *event,\n                               bool active,\n                               bool ready,\n                               void *context);\n    const LinkGtkManufacturerExtension *manufacturer_extension;\n''',
          '''    void (*diagnostic_changed)(const LinkDiagnosticFlow *flow,\n                               const LinkDiagnosticFlowEvent *event,\n                               bool active,\n                               bool ready,\n                               void *context);\n    void (*append_session_state_json)(GString *json, void *context);\n    const LinkGtkManufacturerExtension *manufacturer_extension;\n''')

          p = Path('platform/linux/link-gtk-shell.c')
          s = p.read_text()
          s = s.replace('''    uint64_t exchange_started_ms;\n} LinkGtkShell;\n''', '''    uint64_t exchange_started_ms;\n    unsigned int diagnostic_retry_count;\n    bool diagnostic_retry_pending;\n    uint64_t diagnostic_retry_at_ms;\n    bool diagnostic_had_failure;\n} LinkGtkShell;\n''', 1)
          s = s.replace('''    shell->exchange_count=0U;shell->exchange_truncated=false;shell->exchange_started_ms=monotonic_ms();\n    shell->adapter_identity[0]='\\0';shell->adapter_device[0]='\\0';\n''', '''    shell->exchange_count=0U;shell->exchange_truncated=false;shell->exchange_started_ms=monotonic_ms();\n    shell->adapter_identity[0]='\\0';shell->adapter_device[0]='\\0';\n    shell->diagnostic_retry_count=0U;shell->diagnostic_retry_pending=false;\n    shell->diagnostic_retry_at_ms=0U;shell->diagnostic_had_failure=false;\n''', 1)
          old = '''    g_string_append(o,",\\n\\\"adapter_device\\\":");json_string(o,shell->adapter_device);g_string_append(o,",\\n\\\"adapter_identity\\\":");json_string(o,shell->adapter_identity);g_string_append(o,",\\n\\\"diagnostic_stage\\\":");json_string(o,link_diagnostic_flow_stage_name(shell->flow.stage));\n    g_string_append_printf(o,",\\n\\\"elm_exchanges\\\":{\\\"captured\\\":%zu,\\\"truncated\\\":%s,\\\"records\\\":[",shell->exchange_count,shell->exchange_truncated?"true":"false");if(shell->exchange_json!=NULL)g_string_append_len(o,shell->exchange_json->str,(gssize)shell->exchange_json->len);g_string_append(o,"]}\\n}\\n");\n'''
          new = '''    g_string_append(o,",\\n\\\"adapter_device\\\":");json_string(o,shell->adapter_device);g_string_append(o,",\\n\\\"adapter_identity\\\":");json_string(o,shell->adapter_identity);g_string_append(o,",\\n\\\"diagnostic_stage\\\":");json_string(o,link_diagnostic_flow_stage_name(shell->flow.stage));\n    g_string_append_printf(o,",\\n\\\"session_complete\\\":%s,\\n\\\"diagnostics_active\\\":%s,\\n\\\"diagnostics_ready\\\":%s,\\n\\\"manufacturer_extension_active\\\":%s,\\n\\\"diagnostic_had_failure\\\":%s,\\n\\\"automatic_retries\\\":%u",\n        shell->diagnostics_ready && !shell->manufacturer_extension_active ? "true" : "false",\n        shell->diagnostics_active ? "true" : "false",\n        shell->diagnostics_ready ? "true" : "false",\n        shell->manufacturer_extension_active ? "true" : "false",\n        shell->diagnostic_had_failure ? "true" : "false",\n        shell->diagnostic_retry_count);\n    if(shell->flow.stage==LINK_DIAGNOSTIC_FLOW_FAILED){g_string_append(o,",\\n\\\"diagnostic_failure\\\":");json_string(o,link_diagnostic_flow_result_name(shell->flow.failure));}\n    if(shell->descriptor->append_session_state_json!=NULL){g_string_append(o,",\\n\\\"product_state\\\":");shell->descriptor->append_session_state_json(o,shell->descriptor->context);}\n    g_string_append_printf(o,",\\n\\\"elm_exchanges\\\":{\\\"captured\\\":%zu,\\\"truncated\\\":%s,\\\"records\\\":[",shell->exchange_count,shell->exchange_truncated?"true":"false");if(shell->exchange_json!=NULL)g_string_append_len(o,shell->exchange_json->str,(gssize)shell->exchange_json->len);g_string_append(o,"]}\\n}\\n");\n'''
          if old not in s: raise SystemExit('session JSON block missing')
          s = s.replace(old, new, 1)

          # Save button makes partial/failed evidence explicit.
          old = '''static void set_connection_state(LinkGtkShell *shell, bool connected, const char *message)\n{\n    gtk_label_set_text(GTK_LABEL(shell->status), message);\n    gtk_button_set_label(GTK_BUTTON(shell->link_button), connected ? "LINK DOWN" : "LINK UP");\n    gtk_widget_set_sensitive(shell->device_combo, !connected);\n}\n'''
          new = '''static void set_connection_state(LinkGtkShell *shell, bool connected, const char *message)\n{\n    gtk_label_set_text(GTK_LABEL(shell->status), message);\n    gtk_button_set_label(GTK_BUTTON(shell->link_button), connected ? "LINK DOWN" : "LINK UP");\n    gtk_widget_set_sensitive(shell->device_combo, !connected);\n    if (shell->save_session_button != NULL) {\n        const char *label = "SAVE SESSION";\n        if (connected && shell->flow.stage == LINK_DIAGNOSTIC_FLOW_FAILED)\n            label = "SAVE FAILED SESSION";\n        else if (connected && !shell->diagnostics_ready)\n            label = "SAVE PARTIAL SESSION";\n        gtk_button_set_label(GTK_BUTTON(shell->save_session_button), label);\n    }\n}\n'''
          if old not in s: raise SystemExit('set_connection_state block missing')
          s = s.replace(old, new, 1)

          # One bounded automatic retry for transient startup/session failures.
          old = '''    shell->manufacturer_extension_active = false;\n    link_diagnostic_flow_fail(&shell->flow, failure);\n    shell->diagnostics_active = false;\n    shell->diagnostics_ready = false;\n    set_connection_state(shell, true,\n                         "Linked · diagnostic session failed · LINK DOWN / LINK UP to retry");\n'''
          new = '''    shell->manufacturer_extension_active = false;\n    link_diagnostic_flow_fail(&shell->flow, failure);\n    shell->diagnostics_active = false;\n    shell->diagnostics_ready = false;\n    shell->diagnostic_had_failure = true;\n    if (shell->diagnostic_retry_count < 1U &&\n        shell->transport.is_connected != NULL &&\n        shell->transport.is_connected(shell->transport.context)) {\n        shell->diagnostic_retry_count++;\n        shell->diagnostic_retry_pending = true;\n        shell->diagnostic_retry_at_ms = monotonic_ms() + UINT64_C(300);\n        set_connection_state(shell, true,\n                             "Linked · diagnostic attempt failed · retrying automatically");\n    } else {\n        set_connection_state(shell, true,\n                             "Linked · diagnostic session failed · SAVE FAILED SESSION or LINK DOWN / LINK UP");\n    }\n'''
          if old not in s: raise SystemExit('fail_diagnostics block missing')
          s = s.replace(old, new, 1)

          s = s.replace('''        config.manufacturer_extension_after_pid_discovery = true;\n        config.restore_adapter_after_manufacturer_extension = true;\n''', '''        config.manufacturer_extension_after_standard_dtcs = true;\n        config.restore_adapter_after_manufacturer_extension = true;\n''', 1)

          old = '''static gboolean pump_serial(gpointer user_data)\n{\n    LinkGtkShell *shell = user_data;\n    link_linux_serial_pump(&shell->serial);\n    if (shell->session_initialized) {\n'''
          new = '''static gboolean pump_serial(gpointer user_data)\n{\n    LinkGtkShell *shell = user_data;\n    const uint64_t now_ms = monotonic_ms();\n    link_linux_serial_pump(&shell->serial);\n    if (shell->diagnostic_retry_pending && now_ms >= shell->diagnostic_retry_at_ms &&\n        shell->transport.is_connected != NULL &&\n        shell->transport.is_connected(shell->transport.context)) {\n        shell->diagnostic_retry_pending = false;\n        stop_diagnostics(shell);\n        if (!start_diagnostics(shell))\n            fail_diagnostics(shell, LINK_DIAGNOSTIC_FLOW_RESULT_ELM_ERROR);\n    }\n    if (shell->session_initialized) {\n'''
          if old not in s: raise SystemExit('pump_serial block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Tests for real trace shapes and new ordering.
          p = Path('tests/test_elm327.c')
          s = p.read_text()
          needle = '''    REQUIRE(pdu_length == 4U && pdu[0] == 0x62U && pdu[1] == 0xf1U);\n'''
          addition = needle + '''\n    memset(&response, 0, sizeof(response));\n    response.result = LINK_ELM327_RESULT_OK;\n    memcpy(response.text, "7F1978\\n5902FF", sizeof("7F1978\\n5902FF"));\n    response.length = strlen(response.text);\n    response.line_count = 2U;\n    REQUIRE(link_elm327_can_decode_pdu(&response, pdu, sizeof(pdu), &pdu_length) ==\n            LINK_ELM327_CAN_RESULT_OK);\n    REQUIRE(pdu_length == 3U && pdu[0] == 0x59U && pdu[1] == 0x02U && pdu[2] == 0xffU);\n'''
          if needle not in s: raise SystemExit('ELM test insertion point missing')
          p.write_text(s.replace(needle, addition, 1))

          p = Path('tests/test_diagnostic_flow.c')
          s = p.read_text()
          marker = '''static int test_invalid_response_order(void)\n'''
          test = r'''static int test_manufacturer_extension_after_standard_dtcs(void)
{
    LinkDiagnosticFlow flow;
    LinkDiagnosticFlowConfig config = LINK_DIAGNOSTIC_FLOW_CONFIG_INIT;
    LinkDiagnosticFlowAction action;
    LinkDiagnosticFlowEvent event;
    LinkElm327Response response;

    config.manufacturer_extension_after_standard_dtcs = true;
    config.restore_adapter_after_manufacturer_extension = true;
    CHECK(link_diagnostic_flow_init(&flow, &config) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(link_diagnostic_flow_start(&flow) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(complete_initialization(&flow) == 0);

    CHECK(link_diagnostic_flow_next_action(&flow, 500U, &action) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(strcmp(action.command, "0100") == 0);
    response = response_ok("410000000000", false);
    CHECK(link_diagnostic_flow_accept_response(&flow, &response, 500U, &event) ==
          LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(flow.stage == LINK_DIAGNOSTIC_FLOW_SCANNING_STORED_DTCS);

    response = response_no_data();
    CHECK(link_diagnostic_flow_next_action(&flow, 600U, &action) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(strcmp(action.command, "03") == 0);
    CHECK(link_diagnostic_flow_accept_response(&flow, &response, 600U, &event) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(link_diagnostic_flow_next_action(&flow, 700U, &action) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(strcmp(action.command, "07") == 0);
    CHECK(link_diagnostic_flow_accept_response(&flow, &response, 700U, &event) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(link_diagnostic_flow_next_action(&flow, 800U, &action) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(strcmp(action.command, "0A") == 0);
    CHECK(link_diagnostic_flow_accept_response(&flow, &response, 800U, &event) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(flow.standard_dtc_inventory_complete);
    CHECK(flow.stage == LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION);
    CHECK(!event.became_ready);

    CHECK(link_diagnostic_flow_next_action(&flow, 801U, &action) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(action.kind == LINK_DIAGNOSTIC_FLOW_ACTION_MANUFACTURER_EXTENSION);
    CHECK(link_diagnostic_flow_resume_after_manufacturer(&flow) == LINK_DIAGNOSTIC_FLOW_RESULT_OK);
    CHECK(flow.stage == LINK_DIAGNOSTIC_FLOW_RESTORING_AFTER_MANUFACTURER);
    CHECK(complete_initialization(&flow) == 0);
    CHECK(flow.stage == LINK_DIAGNOSTIC_FLOW_LIVE);
    return 0;
}

'''
          if marker not in s: raise SystemExit('diagnostic test insertion point missing')
          s = s.replace(marker, test + marker, 1)
          s = s.replace('''    if (test_manufacturer_extension_restore() != 0) return 1;\n    if (test_invalid_response_order() != 0) return 1;\n''', '''    if (test_manufacturer_extension_restore() != 0) return 1;\n    if (test_manufacturer_extension_after_standard_dtcs() != 0) return 1;\n    if (test_invalid_response_order() != 0) return 1;\n''', 1)
          p.write_text(s)

          Path('VERSION').write_text('0.14.2\n')
          Path('.github/workflows/fix-real-vehicle-diagnostics.yml').unlink()
          PY
      - name: Build and test repaired LINK
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cc -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wformat=2 -Wstrict-prototypes -Wmissing-prototypes \
            $(pkg-config --cflags gtk4) -Iinclude -Iplatform/linux -Isrc/infiltratr-common/include \
            -fsyntax-only platform/linux/link-gtk-shell.c
      - name: Publish repaired main
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Release 0.14.2: harden real-vehicle diagnostic flow'
          git push origin HEAD:main
