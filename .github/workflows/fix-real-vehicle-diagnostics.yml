name: Temporary real-vehicle diagnostics repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-real-vehicle-diagnostics.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Apply repair
        run: python3 scripts/repair-real-vehicle.py
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cc -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wformat=2 -Wstrict-prototypes -Wmissing-prototypes $(pkg-config --cflags gtk4) -Iinclude -Iplatform/linux -Isrc/infiltratr-common/include -fsyntax-only platform/linux/link-gtk-shell.c
      - name: Publish repaired main
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Release 0.14.2: harden real-vehicle diagnostic flow'
          git push origin HEAD:main
