                  'LINK 将 Linux 连接直接用于 ELM 初始化、受支持 PID 检测、已存储/待定/永久 OBD-II 故障清单以及实时轮询。',
                  '经来源确认', '已定义 {count} 个网络',
                  '完成 · 已存储 {stored} · 待定 {pending} · 永久 {permanent}',
                  '梅赛德斯-奔驰诊断', '捷豹 X400 诊断'
              ],
              'hi_in': [
                  'कोई अडैप्टर नहीं', 'कनेक्ट नहीं है', 'LINK ऑफ़लाइन', 'वाहन प्रमाण', 'वाहन प्रोफ़ाइल',
                  'कनेक्शन', 'Linux डायग्नोस्टिक लिंक', 'प्लेटफ़ॉर्म', 'इंजन', 'परिवार', 'प्रोफ़ाइल',
                  'इंजन ECU', 'परिभाषा', 'भौतिक CAN', 'मॉडल वर्ष', 'नेटवर्क मानचित्र',
                  'ऊपर अडैप्टर चुनें और कनेक्ट दबाएँ', 'डायग्नोस्टिक प्रवाह',
                  'LINK Linux कनेक्शन को सीधे ELM आरंभ, समर्थित PID खोज, संग्रहीत/लंबित/स्थायी OBD-II दोष सूची और लाइव पोलिंग तक ले जाता है।',
                  'स्रोतों से पुष्ट', '{count} परिभाषित नेटवर्क',
                  'पूर्ण · {stored} संग्रहीत · {pending} लंबित · {permanent} स्थायी',
                  'Mercedes-Benz डायग्नोस्टिक्स', 'Jaguar X400 डायग्नोस्टिक्स'
              ],
              'ar': [
                  'لا يوجد محول', 'غير متصل', 'LINK غير متصل', 'بيانات المركبة', 'ملف المركبة',
                  'الاتصال', 'رابط تشخيص Linux', 'المنصة', 'المحرك', 'العائلة', 'الملف',
                  'ECU المحرك', 'التعريف', 'CAN الفعلي', 'سنوات الطراز', 'خريطة الشبكة',
                  'حدد محولاً أعلاه ثم اضغط اتصال', 'مسار التشخيص',
                  'ينقل LINK اتصال Linux مباشرة إلى تهيئة ELM واكتشاف PIDs المدعومة وجرد أعطال OBD-II المخزنة/المعلقة/الدائمة والاستعلام الحي.',
                  'مؤكد بالمصادر', '{count} شبكات معرّفة',
                  'مكتمل · {stored} مخزنة · {pending} معلقة · {permanent} دائمة',
                  'تشخيص Mercedes-Benz', 'تشخيص Jaguar X400'
              ],
              'ja_jp': [
                  'アダプターなし', '未接続', 'LINK オフライン', '車両エビデンス', '車両プロファイル',
                  '接続', 'Linux 診断リンク', 'プラットフォーム', 'エンジン', 'ファミリー', 'プロファイル',
                  'エンジン ECU', '定義', '物理 CAN', 'モデル年', 'ネットワークマップ',
                  '上でアダプターを選択して「接続」を押してください', '診断フロー',
                  'LINK は Linux 接続を ELM 初期化、対応 PID 検出、保存済み/保留中/永続 OBD-II 故障一覧、ライブポーリングへ直接つなぎます。',
                  '情報源で確認済み', '定義済みネットワーク: {count}',
                  '完了 · 保存済み {stored} · 保留中 {pending} · 永続 {permanent}',
                  'Mercedes-Benz 診断', 'Jaguar X400 診断'
              ],
              'ko_kr': [
                  '어댑터 없음', '연결되지 않음', 'LINK 오프라인', '차량 증거', '차량 프로필',
                  '연결', 'Linux 진단 링크', '플랫폼', '엔진', '계열', '프로필',
                  '엔진 ECU', '정의', '물리 CAN', '모델 연도', '네트워크 맵',
                  '위에서 어댑터를 선택하고 연결을 누르세요', '진단 흐름',
                  'LINK는 Linux 연결을 ELM 초기화, 지원 PID 검색, 저장/대기/영구 OBD-II 고장 목록 및 실시간 폴링으로 직접 연결합니다.',
                  '출처로 확인됨', '정의된 네트워크 {count}개',
                  '완료 · 저장 {stored} · 대기 {pending} · 영구 {permanent}',
                  'Mercedes-Benz 진단', 'Jaguar X400 진단'
              ],
              'id_id': [
                  'Tanpa adaptor', 'TIDAK TERHUBUNG', 'LINK OFFLINE', 'BUKTI KENDARAAN', 'PROFIL KENDARAAN',
                  'KONEKSI', 'Tautan diagnostik Linux', 'Platform', 'Mesin', 'Keluarga', 'Profil',
                  'ECU mesin', 'Definisi', 'CAN fisik', 'Tahun model', 'Peta jaringan',
                  'Pilih adaptor di atas lalu tekan HUBUNGKAN', 'Alur diagnostik',
                  'LINK membawa koneksi Linux langsung ke inisialisasi ELM, penemuan PID yang didukung, inventaris kesalahan OBD-II tersimpan/tertunda/permanen, dan polling langsung.',
                  'dikonfirmasi oleh sumber', '{count} jaringan ditentukan',
                  'SELESAI · {stored} tersimpan · {pending} tertunda · {permanent} permanen',
                  'Diagnostik Mercedes-Benz', 'Diagnostik Jaguar X400'
              ],
          }

          for locale, values in translations.items():
              if len(values) != len(keys):
                  raise RuntimeError(f'{locale}: {len(values)} values for {len(keys)} keys')

          text = core.read_text(encoding='utf-8')
          for array_name, values in translations.items():
              marker = f'static const InfiltratrI18nEntry {array_name}[] = {{'
              start = text.find(marker)
              if start < 0:
                  raise RuntimeError(f'missing catalogue {array_name}')
              body_start = start + len(marker)
              end = text.find('\n};', body_start)
              if end < 0:
                  raise RuntimeError(f'missing end for {array_name}')
              block = text[start:end]
              if 'linux.vehicle.evidence' in block:
                  continue
              lines = []
              for key, value in zip(keys, values):
                  lines.append(f'    ENTRY({json.dumps(key, ensure_ascii=False)}, {json.dumps(value, ensure_ascii=False)}),')
              insertion = '\n' + '\n'.join(lines)
              text = text[:end] + insertion + text[end:]
          core.write_text(text, encoding='utf-8')

          g = gtk.read_text(encoding='utf-8')
          mapping_anchor = '        {"Adapter", "common.adapter"},\n'
          new_mappings = '''        {"No adapter", "linux.no_adapter"},
        {"NOT LINKED", "linux.status.not_linked"},
        {"LINK OFFLINE", "linux.status.offline"},
        {"VEHICLE EVIDENCE", "linux.vehicle.evidence"},
        {"VEHICLE PROFILE", "linux.vehicle.profile"},
        {"CONNECTION", "linux.section.connection"},
        {"Linux diagnostic link", "linux.connection.title"},
        {"Platform", "linux.label.platform"},
        {"Engine", "linux.label.engine"},
        {"Family", "linux.label.family"},
        {"Profile", "linux.label.profile"},
        {"Engine ECU", "linux.label.engine_ecu"},
        {"Definition", "linux.label.definition"},
        {"Physical CAN", "linux.label.physical_can"},
        {"Model years", "linux.label.model_years"},
        {"Network map", "linux.label.network_map"},
        {"Select an adapter above and press LINK UP", "linux.connection.select_adapter"},
        {"Diagnostic flow", "linux.label.diagnostic_flow"},
        {"LINK carries the Linux connection directly into ELM initialisation, supported-PID discovery, stored/pending/permanent OBD-II fault inventory and live polling.", "linux.connection.description"},
        {"source-corroborated", "linux.value.source_corroborated"},
        {"Mercedes-Benz Diagnostics", "linux.title.mercedes"},
        {"Jaguar X400 Diagnostics", "linux.title.jaguar"},
'''
          if 'linux.vehicle.evidence' not in g:
              if mapping_anchor not in g:
                  raise RuntimeError('translation mapping anchor changed')
              g = g.replace(mapping_anchor, mapping_anchor + new_mappings, 1)

          old_fault = '''    {
        size_t stored_count, pending_count, permanent_count;
        if (sscanf(text, "COMPLETE · %zu stored · %zu pending · %zu permanent",
                   &stored_count, &pending_count, &permanent_count) == 3) {
            if (selected_language() == 1) {
                (void)snprintf(dynamic, sizeof(dynamic),
                               "ABGESCHLOSSEN · %zu gespeichert · %zu anstehend · %zu permanent",
                               stored_count, pending_count, permanent_count);
                return dynamic;
            }
            if (selected_language() == 2) {
                (void)snprintf(dynamic, sizeof(dynamic),
                               "ZAKOŃCZONO · %zu zapisanych · %zu oczekujących · %zu trwałych",
                               stored_count, pending_count, permanent_count);
                return dynamic;
            }
        }
    }
'''
          new_fault = '''    {
        size_t stored_count, pending_count, permanent_count;
        if (sscanf(text, "COMPLETE · %zu stored · %zu pending · %zu permanent",
                   &stored_count, &pending_count, &permanent_count) == 3) {
            char stored_text[32];
            char pending_text[32];
            char permanent_text[32];
            InfiltratrI18nArgument arguments[3];
            (void)snprintf(stored_text, sizeof(stored_text), "%zu", stored_count);
            (void)snprintf(pending_text, sizeof(pending_text), "%zu", pending_count);
            (void)snprintf(permanent_text, sizeof(permanent_text), "%zu", permanent_count);
            arguments[0].name = "stored";
            arguments[0].value = stored_text;
            arguments[1].name = "pending";
            arguments[1].value = pending_text;
            arguments[2].name = "permanent";
            arguments[2].value = permanent_text;
            (void)link_i18n_format_text(dynamic, sizeof(dynamic),
                                        "linux.faults.complete", arguments, 3U);
            return dynamic;
        }
    }
'''
          if old_fault not in g:
              raise RuntimeError('formatted fault block changed')
          g = g.replace(old_fault, new_fault, 1)

          old_network = '''    {
        size_t network_count;
        if (sscanf(text, "%zu defined networks", &network_count) == 1 &&
            strstr(text, "defined networks") != NULL) {
            if (selected_language() == 1) {
                (void)snprintf(dynamic, sizeof(dynamic), "%zu definierte Netzwerke", network_count);
                return dynamic;
            }
            if (selected_language() == 2) {
                (void)snprintf(dynamic, sizeof(dynamic), "%zu zdefiniowanych sieci", network_count);
                return dynamic;
            }
        }
    }
'''
          new_network = '''    {
        size_t network_count;
        if (sscanf(text, "%zu defined networks", &network_count) == 1 &&
            strstr(text, "defined networks") != NULL) {
            char count_text[32];
            InfiltratrI18nArgument argument;
            (void)snprintf(count_text, sizeof(count_text), "%zu", network_count);
            argument.name = "count";
            argument.value = count_text;
            (void)link_i18n_format_text(dynamic, sizeof(dynamic),
                                        "linux.networks.defined", &argument, 1U);
            return dynamic;
        }
    }
'''
          if old_network not in g:
              raise RuntimeError('formatted network block changed')
          g = g.replace(old_network, new_network, 1)
          gtk.write_text(g, encoding='utf-8')

          t = tests.read_text(encoding='utf-8')
          test_anchor = '    passed &= check(!link_i18n_set_locale("zz-ZZ"),\n'
          test_block = '''    passed &= check(link_i18n_set_locale("pt-BR"), "pt-BR Linux shell selection failed");
    passed &= check(strcmp(link_i18n_tr("linux.vehicle.profile"), "PERFIL DO VEÍCULO") == 0,
                    "pt-BR Linux vehicle-profile translation mismatch");
    passed &= check(strcmp(link_i18n_tr("linux.connection.select_adapter"),
                           "Selecione um adaptador acima e pressione CONECTAR") == 0,
                    "pt-BR Linux connection guidance translation mismatch");
    passed &= check(link_i18n_set_locale("zh-CN"), "zh-CN Linux shell selection failed");
    passed &= check(strcmp(link_i18n_tr("linux.vehicle.evidence"), "车辆证据") == 0,
                    "zh-CN Linux vehicle-evidence translation mismatch");
    {
        InfiltratrI18nArgument count_argument = {"count", "4"};
        (void)link_i18n_format(buffer, sizeof(buffer), "linux.networks.defined",
                               &count_argument, 1U);
        passed &= check(strcmp(buffer, "已定义 4 个网络") == 0,
                        "zh-CN network-count interpolation mismatch");
    }

'''
          if 'pt-BR Linux shell selection failed' not in t:
              if test_anchor not in t:
                  raise RuntimeError('test insertion anchor changed')
              t = t.replace(test_anchor, test_block + test_anchor, 1)
              tests.write_text(t, encoding='utf-8')

          Path('VERSION').write_text('0.13.6\n', encoding='utf-8')
          PY

          rm -f .github/workflows/tmp-fix-linux-i18n.yml
          git diff --check
          git add -A
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git commit -m "Fix 15-language Linux shell localisation"
          git push origin HEAD:main
