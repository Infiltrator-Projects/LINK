                  'COMPLETE · {stored} stored · {pending} pending · {permanent} permanent',
                  'Mercedes-Benz Diagnostics', 'Jaguar X400 Diagnostics'
              ],
              'de_de': [
                  'Kein Adapter', 'NICHT VERBUNDEN', 'LINK GETRENNT', 'FAHRZEUGNACHWEIS', 'FAHRZEUGPROFIL',
                  'VERBINDUNG', 'Linux-Diagnoseverbindung', 'Plattform', 'Motor', 'Familie', 'Profil',
                  'Motorsteuergerät', 'Definition', 'Physischer CAN', 'Modelljahre', 'Netzwerkübersicht',
                  'Oben einen Adapter auswählen und VERBINDEN drücken', 'Diagnoseablauf',
