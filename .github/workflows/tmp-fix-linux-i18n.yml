              ],
              'zh_cn': [
                  '无适配器', '未连接', 'LINK 离线', '车辆证据', '车辆配置',
                  '连接', 'Linux 诊断连接', '平台', '发动机', '系列', '配置',
                  '发动机 ECU', '定义', '物理 CAN', '车型年份', '网络映射',
