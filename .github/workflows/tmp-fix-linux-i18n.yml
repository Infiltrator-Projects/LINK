                  'potwierdzone źródłami', '{count} zdefiniowanych sieci',
                  'ZAKOŃCZONO · {stored} zapisanych · {pending} oczekujących · {permanent} trwałych',
                  'Diagnostyka Mercedes-Benz', 'Diagnostyka Jaguar X400'
              ],
              'pt_br': [
                  'Sem adaptador', 'NÃO CONECTADO', 'LINK OFFLINE', 'DADOS DO VEÍCULO', 'PERFIL DO VEÍCULO',
                  'CONEXÃO', 'Conexão de diagnóstico Linux', 'Plataforma', 'Motor', 'Família', 'Perfil',
                  'ECU do motor', 'Definição', 'CAN físico', 'Anos do modelo', 'Mapa de rede',
