name: Temporary shared Linux localisation repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-linux-i18n.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Repair shared Linux localisation coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          core = root / 'src/core/i18n.c'
          gtk = root / 'platform/linux/link-gtk-i18n.c'
          tests = root / 'tests/test_i18n.c'

          keys = [
              'linux.no_adapter',
              'linux.status.not_linked',
              'linux.status.offline',
              'linux.vehicle.evidence',
              'linux.vehicle.profile',
              'linux.section.connection',
              'linux.connection.title',
              'linux.label.platform',
              'linux.label.engine',
              'linux.label.family',
              'linux.label.profile',
              'linux.label.engine_ecu',
              'linux.label.definition',
              'linux.label.physical_can',
              'linux.label.model_years',
              'linux.label.network_map',
              'linux.connection.select_adapter',
              'linux.label.diagnostic_flow',
              'linux.connection.description',
              'linux.value.source_corroborated',
              'linux.networks.defined',
              'linux.faults.complete',
              'linux.title.mercedes',
              'linux.title.jaguar',
          ]

