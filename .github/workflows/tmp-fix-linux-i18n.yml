name: Temporary shared Linux localisation repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-linux-i18n.yml
      - .github/tmp_fix_linux_i18n.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply shared Linux localisation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp_fix_linux_i18n.py
          rm -f .github/tmp_fix_linux_i18n.py .github/workflows/tmp-fix-linux-i18n.yml
          git diff --check
          git add -A
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git commit -m "Fix 15-language Linux shell localisation"
          git push origin HEAD:main
