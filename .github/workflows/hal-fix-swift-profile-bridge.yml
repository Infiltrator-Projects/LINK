name: HAL fix Swift profile bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-fix-swift-profile-bridge.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix NSDictionary bridge in Apple profile summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/apple/LinkDiagnosticUI.swift')
          s = p.read_text()
          old = 'responderCount: Int(LinkVehicleProfileStandardResponderCount(profile)),'
          new = 'responderCount: Int(LinkVehicleProfileStandardResponderCount(profile as! [AnyHashable: Any])),'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one unbridged responderCount call, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          grep -F 'LinkVehicleProfileStandardResponderCount(profile as! [AnyHashable: Any])' platform/apple/LinkDiagnosticUI.swift

      - name: Publish source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add platform/apple/LinkDiagnosticUI.swift
          git diff --cached --check
          git commit -m "Fix Apple vehicle profile Swift bridge"
          git push origin HEAD:main
