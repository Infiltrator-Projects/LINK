name: One-time copyright normalization

on:
  push:
    paths:
      - ".github/workflows/copyright-normalize-once.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Shannon Smith copyright ranges
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          pattern = re.compile(
              r'((?:©|\([cC]\)|:)?\s*)(?:19|20)\d{2}(?:\s*[-–]\s*(?:19|20)\d{2})?(\s+Shannon Smith)'
          )

          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              changed = False
              lines = []
              for line in text.splitlines(keepends=True):
                  lower = line.lower()
                  if "Shannon Smith" in line and ("copyright" in lower or "©" in line):
                      new_line = pattern.sub(r'\g<1>2000-2026\2', line)
                      if new_line != line:
                          changed = True
                          line = new_line
                  lines.append(line)

              if changed:
                  path.write_text("".join(lines), encoding="utf-8", newline="")
          PY

          git rm .github/workflows/copyright-normalize-once.yml
          git config user.name "Infiltrator Projects Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize copyright to 2000-2026"
          git push origin HEAD:main
