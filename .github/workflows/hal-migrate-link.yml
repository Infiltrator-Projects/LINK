name: HAL one-shot LINK migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-migrate-link.yml
      - .github/hal_migrate_link.py

permissions:
  contents: write

concurrency:
  group: hal-one-shot-link-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out LINK recursively
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply shared-layer migration
        run: python3 .github/hal_migrate_link.py

      - name: Validate migration script outputs
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile .github/hal_migrate_link.py
          bash -n packaging/native-product-installer.sh.in
          grep -Fq 'link_units_convert_fuel_economy' include/link/units.h
          grep -Fq 'link_session_trace_init' include/link/session_trace.h
          grep -Fq 'LinkVehicleProfileCachedPIDs' platform/apple/LinkDiagnosticsController.h
          grep -Fq 'struct LinkDiagnosticParameter' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'link_discover_standard_uds29_target_at' include/link/discover.h

      - name: Build and test LINK core
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-hal-migration \
            -DCMAKE_BUILD_TYPE=Release \
            -DLINK_ENABLE_INSTALL=OFF \
            -DBUILD_TESTING=ON
          cmake --build build-hal-migration --parallel 2
          ctest --test-dir build-hal-migration --output-on-failure --parallel 2

      - name: Commit tested migration and remove one-shot files
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/hal_migrate_link.py .github/workflows/hal-migrate-link.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Migrate reusable product behaviour into LINK'
          git push origin HEAD:main
