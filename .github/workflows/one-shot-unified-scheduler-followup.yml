# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot unified scheduler follow-up

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-unified-scheduler-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f"{path}: expected one match, got {n}")
              p.write_text(s.replace(old,new,1))

          # ATAR is the lightweight ELM receive-filter restore used when a
          # scheduled manufacturer job hands the channel back to standard OBD.
          once('src/core/transport.c',
               'strcmp(command, "ATCAF1") == 0 || strcmp(command, "ATCFC1") == 0 ||\n        strncmp(command, "ATSH", 4U) == 0 || strncmp(command, "ATCRA", 5U) == 0)',
               'strcmp(command, "ATCAF1") == 0 || strcmp(command, "ATCFC1") == 0 ||\n        strcmp(command, "ATAR") == 0 ||\n        strncmp(command, "ATSH", 4U) == 0 || strncmp(command, "ATCRA", 5U) == 0)')

          # Linux uses the same portable action enum. A product which registers
          # scheduled manufacturer work gets the same serialized extension slot.
          once('platform/linux/link-gtk-shell.c',
               '''    case LINK_DIAGNOSTIC_FLOW_ACTION_MANUFACTURER_EXTENSION:\n        if (!manufacturer_extension_available(shell)) {\n            shell->manufacturer_extension_active = true;\n            return finish_manufacturer_extension(shell, false);\n        }\n        return begin_manufacturer_extension(shell);\n\n    case LINK_DIAGNOSTIC_FLOW_ACTION_FAILED:''',
               '''    case LINK_DIAGNOSTIC_FLOW_ACTION_MANUFACTURER_EXTENSION:\n    case LINK_DIAGNOSTIC_FLOW_ACTION_SCHEDULED_MANUFACTURER_JOB:\n        if (!manufacturer_extension_available(shell)) {\n            shell->manufacturer_extension_active = true;\n            return finish_manufacturer_extension(shell, false);\n        }\n        return begin_manufacturer_extension(shell);\n\n    case LINK_DIAGNOSTIC_FLOW_ACTION_FAILED:''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/transport.c platform/linux/link-gtk-shell.c
          git rm .github/workflows/one-shot-unified-scheduler-followup.yml
          git commit -m "Complete unified live scheduler platform support"
          git push origin HEAD:main
