# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL one-shot maintenance

on:
  push:
    branches: [hal/common-1.19.38-forensic]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout recursively
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply forensic dependency refresh
        run: python3 scripts/hal-maintenance-patch.py
      - name: Validate release metadata
        run: |
          test "$(cat VERSION)" = "0.15.91"
          grep -Fq 'set(LINK_COMMON_VERSION "1.19.38")' CMakeLists.txt
          test "$(cat src/infiltratr-common/VERSION)" = "1.19.38"
      - name: Build and test portable core
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Commit validated maintenance result
        run: |
          git config user.name "HAL maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release 0.15.91: update Common to 1.19.38"
          git push origin HEAD:${GITHUB_REF_NAME}
