# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL Common 1.16.0 CMake migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Bootstrap Common 1.16.0 CMake pin helper'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Synchronise CMake Common pin
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/set(LINK_COMMON_VERSION "1\.15\.7")/set(LINK_COMMON_VERSION "1.16.0")/' CMakeLists.txt
          sed -i 's/set(LINK_COMMON_COMMIT "e9b747c7c0530590fbba1f57788e046203ef8c4e")/set(LINK_COMMON_COMMIT "a9db06b11f493c4e6f42bf6c13cc5cc5c73e1fc4")/' CMakeLists.txt
          grep -Fq 'set(LINK_COMMON_VERSION "1.16.0")' CMakeLists.txt
          grep -Fq 'set(LINK_COMMON_COMMIT "a9db06b11f493c4e6f42bf6c13cc5cc5c73e1fc4")' CMakeLists.txt
          test "$(git diff --name-only)" = "CMakeLists.txt"
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add CMakeLists.txt
          git commit -m 'Complete Common 1.16.0 CMake pin'
          git push origin HEAD:main
