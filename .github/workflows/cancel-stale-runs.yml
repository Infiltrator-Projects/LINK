name: Cancel stale self-hosted runs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale queued runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 33711168057 33701228818 33699887021 33696079359 33692508185; do
            echo "Cancelling workflow run ${run_id}"
            code="$(curl -sS -o /tmp/cancel-${run_id}.txt -w '%{http_code}' \
              -L -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")"
            if [[ "$code" == "202" || "$code" == "409" ]]; then
              echo "Run ${run_id}: HTTP ${code}"
            else
              cat /tmp/cancel-${run_id}.txt >&2 || true
              echo "Failed to cancel run ${run_id}: HTTP ${code}" >&2
              exit 1
            fi
          done
