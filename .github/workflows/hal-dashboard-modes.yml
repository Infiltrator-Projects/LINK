# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL shared dashboard modes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-dashboard-modes.yml

permissions:
  contents: write

concurrency:
  group: hal-link-dashboard-modes
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Apply shared dashboard presentation model
        run: python3 .github/hal_dashboard_migrate.py

      - name: Validate and test shared core
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Commit tested dashboard engine to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare LINK 0.15.4 shared dashboard modes"
          git push origin HEAD:main
