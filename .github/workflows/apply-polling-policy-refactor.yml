name: Apply polling policy refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refactor-polling-policy.py'
      - '.github/workflows/apply-polling-policy-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply guarded refactor
        run: python3 scripts/refactor-polling-policy.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- include/link/scheduler.h src/core/scheduler.c \
            platform/apple/LinkDiagnosticsController.m \
            tests/apple/ProfileRegression.swift tests/apple/run-regressions.sh \
            VERSION include/link/version.h
          grep -Fq 'LinkPollingPolicy _pollingPolicy;' platform/apple/LinkDiagnosticsController.m
          ! grep -Fq '_pidPollingEnabled' platform/apple/LinkDiagnosticsController.m

      - name: Build and test portable core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Run Apple regression harness
        shell: bash
        run: |
          set -euo pipefail
          bash tests/apple/run-regressions.sh

      - name: Commit product refactor to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add include/link/scheduler.h src/core/scheduler.c \
            platform/apple/LinkDiagnosticsController.m \
            tests/apple/ProfileRegression.swift tests/apple/run-regressions.sh \
            VERSION include/link/version.h
          if git diff --cached --quiet; then
            echo 'No product changes produced by guarded refactor.' >&2
            exit 1
          fi
          git commit -m 'Refactor polling policy ownership into LINK core'
          git push origin HEAD:main
