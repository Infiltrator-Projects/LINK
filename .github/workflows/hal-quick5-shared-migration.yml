name: HAL quick shared migration

on:
  push:
    paths:
      - .github/workflows/hal-quick5-shared-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Move small generic defaults and installer assembly into LINK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing anchor in {path}: {old[:80]!r}')
              if s.count(old) != 1:
                  raise SystemExit(f'non-unique anchor in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'include/link/session_trace.h',
              'bool link_session_trace_init(\n    LinkSessionTrace *trace, const uint8_t *graph_pids, size_t graph_count);\n',
              '/* Shared default SAE live-data graph set used by LINK product faces. */\n'
              'const uint8_t *link_session_trace_default_graph_pids(size_t *count);\n\n'
              'bool link_session_trace_init(\n    LinkSessionTrace *trace, const uint8_t *graph_pids, size_t graph_count);\n')

          replace_once(
              'src/core/session_trace.c',
              '#include <stdio.h>\n#include <string.h>\n\n',
              '#include <stdio.h>\n#include <string.h>\n\n'
              'static const uint8_t link_default_graph_pids[] = {\n'
              '    UINT8_C(0x0c), UINT8_C(0x0d), UINT8_C(0x05), UINT8_C(0x23),\n'
              '    UINT8_C(0x2f), UINT8_C(0x11), UINT8_C(0x46), UINT8_C(0x49)\n'
              '};\n\n'
              'const uint8_t *link_session_trace_default_graph_pids(size_t *count)\n'
              '{\n'
              '    if (count != NULL)\n'
              '        *count = sizeof(link_default_graph_pids) / sizeof(link_default_graph_pids[0]);\n'
              '    return link_default_graph_pids;\n'
              '}\n\n')

          replace_once(
              'include/link/scheduler.h',
              'LinkSchedulerResult link_scheduler_configure_standard_obd2_bits(LinkScheduler *scheduler, const uint8_t supported_bits[LINK_OBD2_PID_SET_BYTES], uint64_t first_due_ms);\n',
              '/* Product-neutral default live polling set for a fresh LINK UI. */\n'
              'const uint8_t *link_scheduler_default_obd2_pids(size_t *count);\n\n'
              'LinkSchedulerResult link_scheduler_configure_standard_obd2_bits(LinkScheduler *scheduler, const uint8_t supported_bits[LINK_OBD2_PID_SET_BYTES], uint64_t first_due_ms);\n')

          replace_once(
              'src/core/scheduler.c',
              '#include <string.h>\n\n',
              '#include <string.h>\n\n'
              'static const uint8_t link_default_polling_pids[] = {\n'
              '    UINT8_C(0x0c), UINT8_C(0x0d), UINT8_C(0x05), UINT8_C(0x23),\n'
              '    UINT8_C(0x11), UINT8_C(0x49), UINT8_C(0x4a), UINT8_C(0x46),\n'
              '    UINT8_C(0x2f)\n'
              '};\n\n'
              'const uint8_t *link_scheduler_default_obd2_pids(size_t *count)\n'
              '{\n'
              '    if (count != NULL)\n'
              '        *count = sizeof(link_default_polling_pids) / sizeof(link_default_polling_pids[0]);\n'
              '    return link_default_polling_pids;\n'
              '}\n\n')
          PY

          cat > packaging/build-native-product-installer.sh <<'EOF'
          #!/usr/bin/env bash
          # SPDX-License-Identifier: GPL-3.0-or-later
          set -Eeuo pipefail

          product_root="${1:?usage: build-native-product-installer.sh PRODUCT_ROOT OUTPUT}"
          output="${2:?usage: build-native-product-installer.sh PRODUCT_ROOT OUTPUT}"
          template="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/native-product-installer.sh.in"
          version="$(tr -d '[:space:]' < "$product_root/VERSION")"

          : "${LINK_NATIVE_PRODUCT_NAME:?}"
          : "${LINK_NATIVE_PRODUCT_SLUG:?}"
          : "${LINK_NATIVE_PACKAGE_NAME:?}"
          : "${LINK_NATIVE_CMAKE_ENABLE_OPTION:?}"
          : "${LINK_NATIVE_CMAKE_PROFILE_OPTION:?}"
          : "${LINK_NATIVE_CMAKE_PACKAGE_VERSION_OPTION:?}"
          : "${LINK_NATIVE_LEGACY_CLEANUP_PATHS:=}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid VERSION: $version" >&2
              exit 1
          }
          test -f "$template"
          grep -qx '__LINK_NATIVE_PAYLOAD_BELOW__' "$template"

          temporary="$(mktemp -d)"
          cleanup() { rm -rf -- "$temporary"; }
          trap cleanup EXIT
          source_epoch="$(git -C "$product_root" log -1 --format=%ct 2>/dev/null || printf '0')"
          payload="$temporary/source.tar.gz"
          generated_header="$temporary/native-installer.sh"

          python3 - "$template" "$generated_header" "$version" <<'PY'
          from pathlib import Path
          import os, sys
          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          values = {
              '__LINK_NATIVE_PRODUCT_NAME__': os.environ['LINK_NATIVE_PRODUCT_NAME'],
              '__LINK_NATIVE_PRODUCT_SLUG__': os.environ['LINK_NATIVE_PRODUCT_SLUG'],
              '__LINK_NATIVE_PACKAGE_NAME__': os.environ['LINK_NATIVE_PACKAGE_NAME'],
              '__LINK_NATIVE_VERSION__': sys.argv[3],
              '__LINK_NATIVE_CMAKE_ENABLE_OPTION__': os.environ['LINK_NATIVE_CMAKE_ENABLE_OPTION'],
              '__LINK_NATIVE_CMAKE_PROFILE_OPTION__': os.environ['LINK_NATIVE_CMAKE_PROFILE_OPTION'],
              '__LINK_NATIVE_CMAKE_PACKAGE_VERSION_OPTION__': os.environ['LINK_NATIVE_CMAKE_PACKAGE_VERSION_OPTION'],
              '__LINK_NATIVE_LEGACY_CLEANUP_PATHS__': os.environ.get('LINK_NATIVE_LEGACY_CLEANUP_PATHS', ''),
          }
          for key, value in values.items():
              if key not in source:
                  raise SystemExit(f'LINK native installer template missing {key}')
              source = source.replace(key, value)
          if '__LINK_NATIVE_' in source.replace('__LINK_NATIVE_PAYLOAD_BELOW__', ''):
              raise SystemExit('Unresolved LINK native installer placeholder')
          Path(sys.argv[2]).write_text(source, encoding='utf-8')
          PY

          tar \
              --directory "$product_root" \
              --sort=name \
              --mtime="@$source_epoch" \
              --owner=0 --group=0 --numeric-owner \
              --pax-option=delete=atime,delete=ctime \
              --exclude-vcs \
              --exclude='./build' --exclude='./build-*' \
              --exclude='*.deb' --exclude='*.ipa' --exclude='*.run' \
              -cf - . | gzip -n -9 > "$payload"

          mkdir -p -- "$(dirname "$output")"
          cp "$generated_header" "$output"
          cat "$payload" >> "$output"
          chmod 0755 "$output"
          test -x "$output"
          "$output" --help >/dev/null
          printf 'Created %s\n' "$output"
          EOF
          chmod 0755 packaging/build-native-product-installer.sh

          grep -q 'link_session_trace_default_graph_pids' include/link/session_trace.h src/core/session_trace.c
          grep -q 'link_scheduler_default_obd2_pids' include/link/scheduler.h src/core/scheduler.c
          test -x packaging/build-native-product-installer.sh

      - name: Build and test LINK
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-hal-quick5 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-hal-quick5 --parallel 2
          ctest --test-dir build-hal-quick5 --output-on-failure

      - name: Publish permanent LINK changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-hal-quick5
          rm -f .github/workflows/hal-quick5-shared-migration.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Centralise small shared product defaults'
          git push origin HEAD:main
