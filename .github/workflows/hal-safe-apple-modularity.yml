# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL safe Apple modularity migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Retry safe Apple modularity migration after Apple harness fix'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply guarded ownership extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hal_safe_apple_modularity.py
          test -s platform/apple/LinkVehicleProfileStore.h
          test -s platform/apple/LinkVehicleProfileStore.inc
          test -s platform/apple/LinkAppleSettings.h
          test -s platform/apple/LinkAppleSettings.inc
          ! grep -Fq '@implementation LinkVehicleProfileStore' platform/apple/LinkDiagnosticsController.m
          ! grep -Fq 'LinkAppleLanguageDefaultsKey' platform/apple/LinkDiagnosticsController.m
          grep -Fq '#include "LinkAppleSettings.inc"' platform/apple/LinkDiagnosticsController.m
          grep -Fq '#include "LinkVehicleProfileStore.inc"' platform/apple/LinkDiagnosticsController.m
          git diff --check

      - name: Validate portable LINK core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-safe-modularity -DCMAKE_BUILD_TYPE=Release
          cmake --build build-safe-modularity --parallel
          ctest --test-dir build-safe-modularity --output-on-failure

      - name: Validate real Apple regression binary
        shell: bash
        run: |
          set -euo pipefail
          bash tests/apple/run-regressions.sh

      - name: Commit tested release and remove migration helpers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'HAL modularity migration'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/hal-safe-apple-modularity.yml scripts/hal_safe_apple_modularity.py
          git add VERSION include/link/version.h \
              platform/apple/LinkDiagnosticsController.h \
              platform/apple/LinkDiagnosticsController.m \
              platform/apple/LinkVehicleProfileStore.h \
              platform/apple/LinkVehicleProfileStore.inc \
              platform/apple/LinkAppleSettings.h \
              platform/apple/LinkAppleSettings.inc \
              tests/apple/ProfileRegression.swift \
              tests/apple/run-regressions.sh \
              docs/APPLE-PROVIDER-BOUNDARY.md
          git diff --cached --check
          git commit -m 'Release 0.15.18: isolate Apple profile and settings ownership' \
              -m 'Move vehicle/profile persistence and Apple language/unit persistence out of the live diagnostic controller while preserving public APIs, storage keys, compile topology, polling behaviour and product source lists. Add simulator regressions for settings persistence and source-ownership guards.'
          git push origin HEAD:main
