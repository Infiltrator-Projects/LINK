name: HAL finalize Apple ownership CI guards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run guarded Apple CI guard update'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure maintenance identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HAL Apple modularity'
          git config user.email 'actions@users.noreply.github.com'

      - name: Point CI evidence guards at the new telemetry owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "grep -Fq 'link_telemetry_recorder_begin(' platform/apple/LinkDiagnosticsController.m":
                  "grep -Fq 'link_telemetry_recorder_begin(' platform/apple/LinkAppleTelemetryRecorder.inc",
              "grep -Fq '\"BLE\", stateName.UTF8String' platform/apple/LinkDiagnosticsController.m":
                  "grep -Fq '\"BLE\", stateName.UTF8String' platform/apple/LinkAppleTelemetryRecorder.inc",
              "grep -Fq 'NATIVE_RX' platform/apple/LinkDiagnosticsController.m":
                  "grep -Fq 'NATIVE_RX' platform/apple/LinkAppleTelemetryRecorder.inc",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one CI ownership guard match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          bash tests/apple/run-regressions.sh
          git add .github/workflows/ci.yml
          git commit -m 'Update CI for Apple telemetry ownership' \
            -m 'Keep the existing evidence regression checks, but point telemetry-specific guards at LinkAppleTelemetryRecorder now that the controller no longer owns that state.'

      - name: Publish only if main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
