name: HAL fix evidence export visibility

on:
  push:
    paths:
      - '.github/workflows/hal-fix-evidence-export-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make evidence export helper public
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/apple/LinkDiagnosticUI.swift')
          s = p.read_text()
          replacements = {
              'enum LinkEvidenceExport {': 'public enum LinkEvidenceExport {',
              '    static func prepareTemporaryCSV(': '    public static func prepareTemporaryCSV(',
              '    static func removeTemporaryFile(_ url: URL?) {': '    public static func removeTemporaryFile(_ url: URL?) {'
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          grep -Fq 'public enum LinkEvidenceExport {' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'public static func prepareTemporaryCSV(' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'public static func removeTemporaryFile(_ url: URL?) {' platform/apple/LinkDiagnosticUI.swift
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HAL migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add platform/apple/LinkDiagnosticUI.swift
          git commit -m 'Expose Apple evidence export helper'
          git push origin HEAD:main
