name: HAL quick fixes

on:
  push:
    paths:
      - '.github/workflows/hal-quick-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed quick fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('platform/apple/LinkBLETransport.m')
          s = p.read_text()
          old = '''    NSString *name = advertisementData[CBAdvertisementDataLocalNameKey];
    if (name.length == 0U) name = peripheral.name;
    if (name.length == 0U || !LinkPeripheralNameLooksLikeAdapter(name)) return;
    if (_requestedPeripheralIdentifier.length != 0U &&
        ![peripheral.identifier.UUIDString
            isEqualToString:_requestedPeripheralIdentifier]) {
        return;
    }
    [self connectPeripheral:peripheral name:name];
'''
          new = '''    NSString *name = advertisementData[CBAdvertisementDataLocalNameKey];
    if (name.length == 0U) name = peripheral.name;
    const BOOL explicitlySelected =
        _requestedPeripheralIdentifier.length != 0U &&
        [peripheral.identifier.UUIDString
            isEqualToString:_requestedPeripheralIdentifier];
    if (_requestedPeripheralIdentifier.length != 0U && !explicitlySelected)
        return;
    /* Automatic discovery remains conservative, but a peripheral the user
     * explicitly selected must be probed by UUID even when its advertisement
     * is unnamed or uses a name LINK has not seen before. */
    if (!explicitlySelected &&
        (name.length == 0U || !LinkPeripheralNameLooksLikeAdapter(name)))
        return;
    if (name.length == 0U) name = @"Selected Bluetooth device";
    [self connectPeripheral:peripheral name:name];
'''
          if s.count(old) != 1:
              raise SystemExit(f'BLE discovery block count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          v = Path('VERSION')
          if v.read_text().strip() != '0.15.11':
              raise SystemExit(f'unexpected LINK VERSION {v.read_text().strip()}')
          v.write_text('0.15.12\n')

          h = Path('include/link/version.h')
          hs = h.read_text()
          hs2, n = re.subn(r'#define LINK_VERSION_STRING "[^"]+"',
                           '#define LINK_VERSION_STRING "0.15.12"', hs, count=1)
          if n != 1:
              raise SystemExit('LINK_VERSION_STRING not found exactly once')
          h.write_text(hs2)
          PY

          rm .github/workflows/hal-quick-fixes.yml
          git diff --check
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --exit-code --quiet && { echo 'No changes produced'; exit 1; } || true
          git commit -m 'Fix explicit Apple BLE peripheral selection'
          git push origin HEAD:main
