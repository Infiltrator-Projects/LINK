name: Repair Apple strict-build shadow warning

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-fix-apple-shadow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename shadowing PID scalar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/apple/LinkDiagnosticsController.m')
          s = p.read_text()
          declaration = '            const unsigned int value = [pid unsignedIntValue];'
          use = '            if (value <= UINT8_MAX) [pids addObject:@(value)];'
          if s.count(declaration) != 1:
              raise SystemExit(f'expected one shadowing declaration, found {s.count(declaration)}')
          if s.count(use) != 1:
              raise SystemExit(f'expected one shadowing use, found {s.count(use)}')
          s = s.replace(declaration, '            const unsigned int pidValue = [pid unsignedIntValue];')
          s = s.replace(use, '            if (pidValue <= UINT8_MAX) [pids addObject:@(pidValue)];')
          p.write_text(s)
          PY
          git diff --check
          grep -F 'const unsigned int pidValue = [pid unsignedIntValue];' platform/apple/LinkDiagnosticsController.m
          ! grep -F 'const unsigned int value = [pid unsignedIntValue];' platform/apple/LinkDiagnosticsController.m

      - name: Build and test LINK
        shell: bash
        run: |
          cmake -S . -B build-hal-apple-shadow -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-hal-apple-shadow --parallel 2
          ctest --test-dir build-hal-apple-shadow --output-on-failure

      - name: Publish permanent source fix and remove helper
        shell: bash
        run: |
          rm -rf build-hal-apple-shadow
          rm -f .github/workflows/hal-fix-apple-shadow.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A platform/apple/LinkDiagnosticsController.m .github/workflows/hal-fix-apple-shadow.yml
          git diff --cached --check
          git commit -m 'Fix Apple strict-build shadow warning'
          git push origin HEAD:main
