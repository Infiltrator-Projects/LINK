name: One-shot Infiltrator design migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: "github.event.head_commit.message == 'Add one-shot Infiltrator design migration'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared typography contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          apple = Path('platform/apple/LinkDiagnosticUI.swift')
          text = apple.read_text(encoding='utf-8')

          old = '''struct LinkDiagnosticTypography {
              let display: Font
              let body: Font
              let bodyBold: Font
              let subheadline: Font
              let subheadlineBold: Font
              let headline: Font
              let caption: Font
              let captionBold: Font
              let caption2: Font
              let caption2Bold: Font
              let title3: Font
              let title2: Font
          }
          '''
          new = old + '''
          extension LinkDiagnosticTypography {
              private static func infiltratorFont(
                  _ name: String,
                  size: CGFloat,
                  relativeTo style: Font.TextStyle,
                  fallbackWeight: Font.Weight
              ) -> Font {
                  if UIFont(name: name, size: size) != nil {
                      return .custom(name, size: size, relativeTo: style)
                  }
                  return .system(size: size, weight: fallbackWeight)
              }

              static var infiltrator: LinkDiagnosticTypography {
                  LinkDiagnosticTypography(
                      display: infiltratorFont(
                          "MBCorpoATitleCondWEB-Regular", size: 29,
                          relativeTo: .title, fallbackWeight: .regular),
                      body: infiltratorFont(
                          "MBCorpoSTitleWEB-Regular", size: 17,
                          relativeTo: .body, fallbackWeight: .regular),
                      bodyBold: infiltratorFont(
                          "MBCorpoSTitleWEB-Bold", size: 17,
                          relativeTo: .body, fallbackWeight: .bold),
                      subheadline: infiltratorFont(
                          "MBCorpoSTitleWEB-Regular", size: 15,
                          relativeTo: .subheadline, fallbackWeight: .regular),
                      subheadlineBold: infiltratorFont(
                          "MBCorpoSTitleWEB-Bold", size: 15,
                          relativeTo: .subheadline, fallbackWeight: .bold),
                      headline: infiltratorFont(
                          "MBCorpoSTitleWEB-Bold", size: 17,
                          relativeTo: .headline, fallbackWeight: .bold),
                      caption: infiltratorFont(
                          "MBCorpoSTitleWEB-Regular", size: 12,
                          relativeTo: .caption, fallbackWeight: .regular),
                      captionBold: infiltratorFont(
                          "MBCorpoSTitleWEB-Bold", size: 12,
                          relativeTo: .caption, fallbackWeight: .bold),
                      caption2: infiltratorFont(
                          "MBCorpoSTitleWEB-Regular", size: 11,
                          relativeTo: .caption2, fallbackWeight: .regular),
                      caption2Bold: infiltratorFont(
                          "MBCorpoSTitleWEB-Bold", size: 11,
                          relativeTo: .caption2, fallbackWeight: .bold),
                      title3: infiltratorFont(
                          "MBCorpoSTitleWEB-Bold", size: 20,
                          relativeTo: .title3, fallbackWeight: .bold),
                      title2: infiltratorFont(
                          "MBCorpoSTitleWEB-Bold", size: 22,
                          relativeTo: .title2, fallbackWeight: .bold))
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('LinkDiagnosticTypography contract changed; refusing migration')
          text = text.replace(old, new, 1)

          old_neutral = '''        typography: LinkDiagnosticTypography(
                      display: .system(size: 29, weight: .semibold),
                      body: .body,
                      bodyBold: .body.bold(),
                      subheadline: .subheadline,
                      subheadlineBold: .subheadline.bold(),
                      headline: .headline,
                      caption: .caption,
                      captionBold: .caption.bold(),
                      caption2: .caption2,
                      caption2Bold: .caption2.bold(),
                      title3: .title3,
                      title2: .title2.bold()))
          }
          '''
          new_neutral = '''        typography: .infiltrator)
          }

          private extension LinkDiagnosticTheme {
              var withInfiltratorTypography: LinkDiagnosticTheme {
                  LinkDiagnosticTheme(
                      backgroundTop: backgroundTop,
                      backgroundMiddle: backgroundMiddle,
                      backgroundBottom: backgroundBottom,
                      panel: panel,
                      panelRaised: panelRaised,
                      primaryText: primaryText,
                      secondaryText: secondaryText,
                      mutedText: mutedText,
                      border: border,
                      accent: accent,
                      success: success,
                      warning: warning,
                      fault: fault,
                      typography: .infiltrator)
              }
          }
          '''
          if text.count(old_neutral) != 1:
              raise SystemExit('LINK neutral theme contract changed; refusing migration')
          text = text.replace(old_neutral, new_neutral, 1)

          old_modifier = '''    func linkDiagnosticTheme(_ theme: LinkDiagnosticTheme) -> some View {
                  environment(\\.linkDiagnosticTheme, theme)
              }
          '''
          new_modifier = '''    func linkDiagnosticTheme(_ theme: LinkDiagnosticTheme) -> some View {
                  environment(\\.linkDiagnosticTheme, theme.withInfiltratorTypography)
              }
          '''
          if text.count(old_modifier) != 1:
              raise SystemExit('LINK theme modifier changed; refusing migration')
          text = text.replace(old_modifier, new_modifier, 1)
          apple.write_text(text, encoding='utf-8')

          gtk = Path('platform/linux/link-gtk-shell.c')
          text = gtk.read_text(encoding='utf-8')
          old = '''static const char link_gtk_base_css[] =
              ".link-root { background: transparent; }"
          '''
          new = '''static const char link_gtk_base_css[] =
              "window, window *, popover, popover * { font-family: \\\"MB Corpo S Title WEB\\\", Sans; font-weight: 400; }"
              ".link-brand { font-family: \\\"MB Corpo A Title Cond WEB\\\", \\\"MB Corpo S Title WEB\\\", Sans; font-weight: 400; }"
              "button, button *, .link-section-title, .link-card-title, .link-detail-value, .link-status-chip { font-family: \\\"MB Corpo S Title WEB\\\", Sans; font-weight: 700; }"
              ".link-root { background: transparent; }"
          '''
          if text.count(old) != 1:
              raise SystemExit('LINK GTK base CSS changed; refusing migration')
          gtk.write_text(text.replace(old, new, 1), encoding='utf-8')

          discover = Path('platform/windows/link-discover-ui.c')
          text = discover.read_text(encoding='utf-8')
          old = '#define LINK_PRODUCT_FONT_UI "Segoe UI"\n'
          new = '#define LINK_PRODUCT_FONT_UI "MB Corpo S Title WEB"\n'
          if text.count(old) != 1:
              raise SystemExit('LINK Windows font default changed; refusing migration')
          text = text.replace(old, new, 1)
          old = '#define LINK_PRODUCT_FONT_DISPLAY LINK_PRODUCT_FONT_UI\n'
          new = '#define LINK_PRODUCT_FONT_DISPLAY "MB Corpo A Title Cond WEB"\n'
          if text.count(old) != 1:
              raise SystemExit('LINK Windows display font default changed; refusing migration')
          discover.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- platform/apple/LinkDiagnosticUI.swift platform/linux/link-gtk-shell.c platform/windows/link-discover-ui.c; then
            echo 'Expected design changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'The-First-Infiltrator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/apple/LinkDiagnosticUI.swift platform/linux/link-gtk-shell.c platform/windows/link-discover-ui.c
          git commit -m 'Adopt shared Infiltrator typography in LINK'
          git push origin HEAD:main
