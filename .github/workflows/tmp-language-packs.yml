name: Temporary language-pack implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-language-packs.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Implement discoverable Languages packs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path('include/link/i18n.h')
          text = header.read_text()
          marker = '/** Number of selectable built-in LINK locales. */'
          block = r'''/**
 * Select a locale from either the built-in catalogue or a discovered .lang
 * pack. External packs may add new BCP-47 locales without recompiling LINK.
 */
          bool link_i18n_select_locale(const char *locale);

          /** Current selected locale, including an external language pack. */
          const char *link_i18n_selected_locale(void);

          /** Translate using the active external pack first, then built-in en-AU fallback. */
          const char *link_i18n_text(const char *key);

          /** Translate and interpolate using external-pack override semantics. */
          size_t link_i18n_format_text(char *destination, size_t capacity, const char *key,
                                       const InfiltratrI18nArgument *arguments,
                                       size_t argument_count);

          /** Load one UTF-8 data-only .lang file. Existing locale packs are replaced. */
          bool link_i18n_load_language_pack(const char *path);

          /** Scan one directory for *.lang files. Returns the number successfully loaded. */
          size_t link_i18n_scan_language_directory(const char *directory);

          /** Release all externally loaded packs. Built-in en-AU remains available. */
          void link_i18n_clear_language_packs(void);

          /** Number of languages available after combining built-ins and discovered packs. */
          size_t link_i18n_installed_locale_count(void);

          /** BCP-47 locale tag for one installed language. */
          const char *link_i18n_installed_locale(size_t index);

          /** Native-language label for one installed language. */
          const char *link_i18n_installed_locale_name(size_t index);

          /** Whether one installed language requests right-to-left layout. */
          bool link_i18n_installed_locale_is_rtl(size_t index);

          /** Whether the currently selected language requests right-to-left layout. */
          bool link_i18n_selected_locale_is_rtl(void);

          '''
          if 'link_i18n_load_language_pack' not in text:
              text = text.replace(marker, block + marker)
              text = text.replace('Select a BCP-47 locale. The UI exposes 15 built-in choices; en-AU is canonical.',
                                  'Select a built-in BCP-47 locale. en-AU is canonical; use link_i18n_select_locale for discovered packs.')
              header.write_text(text)

          platform = Path('src/core/i18n_platform.c')
          text = platform.read_text()
          text = text.replace('#include "link/i18n.h"\n', '#include "link/i18n.h"\n\n#include <ctype.h>\n#include <stdio.h>\n#include <string.h>\n')
          text = text.replace('#else\n#include <stdlib.h>\n#endif', '#else\n#include <dirent.h>\n#include <stdlib.h>\n#endif')
          text = text.replace('return link_i18n_set_locale(utf8);', 'return link_i18n_select_locale(utf8);')
          text = text.replace('return link_i18n_set_locale(locale);', 'return link_i18n_select_locale(locale);')
          if 'LINK_LANGUAGE_PACK_MAX_PACKS' not in text:
              text += r'''

#define LINK_LANGUAGE_PACK_MAX_PACKS 64U
#define LINK_LANGUAGE_PACK_MAX_FILES 128U
#define LINK_LANGUAGE_PACK_PATH_CAPACITY 1024U

typedef struct LinkLanguagePackEntry {
    char *key;
    char *value;
} LinkLanguagePackEntry;

typedef struct LinkLanguagePack {
    char locale[32];
    char native_name[128];
    bool rtl;
    unsigned int version;
    LinkLanguagePackEntry *entries;
    size_t entry_count;
} LinkLanguagePack;

static LinkLanguagePack language_packs[LINK_LANGUAGE_PACK_MAX_PACKS];
static size_t language_pack_count;
static char selected_pack_locale[32];

static char *pack_duplicate(const char *text)
{
    size_t length;
    char *copy;
    if (text == NULL) return NULL;
    length = strlen(text);
    copy = malloc(length + 1U);
    if (copy == NULL) return NULL;
    memcpy(copy, text, length + 1U);
    return copy;
}

static char *pack_trim(char *text)
{
    char *end;
    if (text == NULL) return NULL;
    while (*text != '\0' && isspace((unsigned char)*text) != 0) ++text;
    end = text + strlen(text);
    while (end > text && isspace((unsigned char)end[-1]) != 0) --end;
    *end = '\0';
    return text;
}

static char *pack_unquote(char *text)
{
    size_t length;
    text = pack_trim(text);
    if (text == NULL) return NULL;
    length = strlen(text);
    if (length >= 2U && ((text[0] == '"' && text[length - 1U] == '"') ||
                        (text[0] == '\'' && text[length - 1U] == '\''))) {
        text[length - 1U] = '\0';
        ++text;
    }
    return text;
}

static bool pack_tag_equal(const char *left, const char *right)
{
    size_t li = 0U;
    size_t ri = 0U;
    if (left == NULL || right == NULL) return false;
    while (left[li] != '\0' && right[ri] != '\0') {
        unsigned char lc = (unsigned char)left[li++];
        unsigned char rc = (unsigned char)right[ri++];
        if (lc == '.' || lc == '@') break;
        if (rc == '.' || rc == '@') break;
        if (lc == '_') lc = '-';
        if (rc == '_') rc = '-';
        if (tolower(lc) != tolower(rc)) return false;
    }
    while (left[li] != '\0' && (left[li] == '.' || left[li] == '@')) ++li;
    while (right[ri] != '\0' && (right[ri] == '.' || right[ri] == '@')) ++ri;
    return (left[li] == '\0' || left[li] == '.' || left[li] == '@') &&
           (right[ri] == '\0' || right[ri] == '.' || right[ri] == '@');
}

static void pack_free(LinkLanguagePack *pack)
{
    size_t index;
    if (pack == NULL) return;
    for (index = 0U; index < pack->entry_count; ++index) {
        free(pack->entries[index].key);
        free(pack->entries[index].value);
    }
    free(pack->entries);
    memset(pack, 0, sizeof(*pack));
}

static LinkLanguagePack *pack_find(const char *locale)
{
    size_t index;
    for (index = 0U; index < language_pack_count; ++index) {
        if (pack_tag_equal(language_packs[index].locale, locale))
            return &language_packs[index];
    }
    return NULL;
}

static const LinkLanguagePack *pack_find_const(const char *locale)
{
    return pack_find(locale);
}

static bool pack_set_entry(LinkLanguagePack *pack, const char *key, const char *value)
{
    size_t index;
    LinkLanguagePackEntry *grown;
    char *key_copy;
    char *value_copy;
    if (pack == NULL || key == NULL || key[0] == '\0' || value == NULL) return false;
    for (index = 0U; index < pack->entry_count; ++index) {
        if (strcmp(pack->entries[index].key, key) == 0) {
            value_copy = pack_duplicate(value);
            if (value_copy == NULL) return false;
            free(pack->entries[index].value);
            pack->entries[index].value = value_copy;
            return true;
        }
    }
    key_copy = pack_duplicate(key);
    value_copy = pack_duplicate(value);
    if (key_copy == NULL || value_copy == NULL) {
        free(key_copy);
        free(value_copy);
        return false;
    }
    grown = realloc(pack->entries, (pack->entry_count + 1U) * sizeof(*grown));
    if (grown == NULL) {
        free(key_copy);
        free(value_copy);
        return false;
    }
    pack->entries = grown;
    pack->entries[pack->entry_count].key = key_copy;
    pack->entries[pack->entry_count].value = value_copy;
    ++pack->entry_count;
    return true;
}

bool link_i18n_load_language_pack(const char *path)
{
    FILE *file;
    char line[4096];
    LinkLanguagePack candidate;
    bool valid = true;
    bool have_locale = false;
    bool have_name = false;
    bool have_version = false;
    LinkLanguagePack *existing;

    if (path == NULL || path[0] == '\0') return false;
    file = fopen(path, "rb");
    if (file == NULL) return false;
    memset(&candidate, 0, sizeof(candidate));
    candidate.version = 1U;

    while (fgets(line, (int)sizeof(line), file) != NULL) {
        char *cursor = pack_trim(line);
        char *equals;
        char *key;
        char *value;
        size_t length = strlen(cursor);
        while (length > 0U && (cursor[length - 1U] == '\n' || cursor[length - 1U] == '\r'))
            cursor[--length] = '\0';
        cursor = pack_trim(cursor);
        if (cursor[0] == '\0' || cursor[0] == '#' || cursor[0] == ';') continue;
        equals = strchr(cursor, '=');
        if (equals == NULL) { valid = false; break; }
        *equals = '\0';
        key = pack_trim(cursor);
        value = pack_unquote(equals + 1);
        if (strcmp(key, "locale") == 0) {
            if (strlen(value) >= sizeof(candidate.locale)) { valid = false; break; }
            (void)snprintf(candidate.locale, sizeof(candidate.locale), "%s", value);
            have_locale = candidate.locale[0] != '\0';
        } else if (strcmp(key, "name") == 0) {
            if (strlen(value) >= sizeof(candidate.native_name)) { valid = false; break; }
            (void)snprintf(candidate.native_name, sizeof(candidate.native_name), "%s", value);
            have_name = candidate.native_name[0] != '\0';
        } else if (strcmp(key, "direction") == 0) {
            if (strcmp(value, "rtl") == 0) candidate.rtl = true;
            else if (strcmp(value, "ltr") == 0) candidate.rtl = false;
            else { valid = false; break; }
        } else if (strcmp(key, "version") == 0) {
            char *end = NULL;
            unsigned long parsed = strtoul(value, &end, 10);
            if (end == value || end == NULL || *end != '\0' || parsed != 1UL) {
                valid = false;
                break;
            }
            candidate.version = (unsigned int)parsed;
            have_version = true;
        } else if (!pack_set_entry(&candidate, key, value)) {
            valid = false;
            break;
        }
    }
    if (ferror(file) != 0) valid = false;
    fclose(file);

    if (!valid || !have_locale || !have_name || !have_version || candidate.entry_count == 0U) {
        pack_free(&candidate);
        return false;
    }

    existing = pack_find(candidate.locale);
    if (existing != NULL) {
        pack_free(existing);
        *existing = candidate;
        return true;
    }
    if (language_pack_count >= LINK_LANGUAGE_PACK_MAX_PACKS) {
        pack_free(&candidate);
        return false;
    }
    language_packs[language_pack_count++] = candidate;
    return true;
}

static int pack_path_compare(const void *left, const void *right)
{
    const char *const *a = left;
    const char *const *b = right;
    return strcmp(*a, *b);
}

size_t link_i18n_scan_language_directory(const char *directory)
{
    char *paths[LINK_LANGUAGE_PACK_MAX_FILES];
    size_t path_count = 0U;
    size_t loaded = 0U;
    size_t index;
    if (directory == NULL || directory[0] == '\0') return 0U;
#ifdef _WIN32
    {
        char pattern[LINK_LANGUAGE_PACK_PATH_CAPACITY];
        WIN32_FIND_DATAA data;
        HANDLE find;
        if (snprintf(pattern, sizeof(pattern), "%s\\*.lang", directory) < 0) return 0U;
        find = FindFirstFileA(pattern, &data);
        if (find == INVALID_HANDLE_VALUE) return 0U;
        do {
            if ((data.dwFileAttributes & FILE_ATTRIBUTE_DIRECTORY) == 0U &&
                path_count < LINK_LANGUAGE_PACK_MAX_FILES) {
                char full[LINK_LANGUAGE_PACK_PATH_CAPACITY];
                int written = snprintf(full, sizeof(full), "%s\\%s", directory, data.cFileName);
                if (written > 0 && (size_t)written < sizeof(full))
                    paths[path_count++] = pack_duplicate(full);
            }
        } while (FindNextFileA(find, &data) != 0);
        FindClose(find);
    }
#else
    {
        DIR *dir = opendir(directory);
        struct dirent *entry;
        if (dir == NULL) return 0U;
        while ((entry = readdir(dir)) != NULL && path_count < LINK_LANGUAGE_PACK_MAX_FILES) {
            const char *name = entry->d_name;
            size_t length = strlen(name);
            if (length > 5U && strcmp(name + length - 5U, ".lang") == 0) {
                char full[LINK_LANGUAGE_PACK_PATH_CAPACITY];
                int written = snprintf(full, sizeof(full), "%s/%s", directory, name);
                if (written > 0 && (size_t)written < sizeof(full))
                    paths[path_count++] = pack_duplicate(full);
            }
        }
        closedir(dir);
    }
#endif
    qsort(paths, path_count, sizeof(paths[0]), pack_path_compare);
    for (index = 0U; index < path_count; ++index) {
        if (paths[index] != NULL && link_i18n_load_language_pack(paths[index])) ++loaded;
        free(paths[index]);
    }
    return loaded;
}

void link_i18n_clear_language_packs(void)
{
    size_t index;
    for (index = 0U; index < language_pack_count; ++index) pack_free(&language_packs[index]);
    language_pack_count = 0U;
    selected_pack_locale[0] = '\0';
}

static bool builtin_locale_matches(const char *locale, size_t *matched_index)
{
    size_t index;
    for (index = 0U; index < link_i18n_supported_locale_count(); ++index) {
        const char *candidate = link_i18n_supported_locale(index);
        if (candidate != NULL && pack_tag_equal(candidate, locale)) {
            if (matched_index != NULL) *matched_index = index;
            return true;
        }
    }
    return false;
}

bool link_i18n_select_locale(const char *locale)
{
    LinkLanguagePack *pack;
    if (locale == NULL || locale[0] == '\0') return false;
    pack = pack_find(locale);
    if (pack != NULL) {
        (void)snprintf(selected_pack_locale, sizeof(selected_pack_locale), "%s", pack->locale);
        if (!link_i18n_set_locale(pack->locale)) (void)link_i18n_set_locale("en-AU");
        return true;
    }
    selected_pack_locale[0] = '\0';
    return link_i18n_set_locale(locale);
}

const char *link_i18n_selected_locale(void)
{
    return selected_pack_locale[0] != '\0' ? selected_pack_locale : link_i18n_locale();
}

const char *link_i18n_text(const char *key)
{
    const LinkLanguagePack *pack;
    size_t index;
    if (key == NULL) return "";
    pack = pack_find_const(link_i18n_selected_locale());
    if (pack != NULL) {
        for (index = 0U; index < pack->entry_count; ++index) {
            if (strcmp(pack->entries[index].key, key) == 0)
                return pack->entries[index].value;
        }
    }
    return link_i18n_tr(key);
}

size_t link_i18n_format_text(char *destination, size_t capacity, const char *key,
                             const InfiltratrI18nArgument *arguments,
                             size_t argument_count)
{
    return infiltratr_i18n_format(destination, capacity, link_i18n_text(key),
                                  arguments, argument_count);
}

size_t link_i18n_installed_locale_count(void)
{
    size_t count = link_i18n_supported_locale_count();
    size_t index;
    for (index = 0U; index < language_pack_count; ++index) {
        if (!builtin_locale_matches(language_packs[index].locale, NULL)) ++count;
    }
    return count;
}

const char *link_i18n_installed_locale(size_t index)
{
    size_t builtin_count = link_i18n_supported_locale_count();
    size_t pack_index;
    if (index < builtin_count) return link_i18n_supported_locale(index);
    index -= builtin_count;
    for (pack_index = 0U; pack_index < language_pack_count; ++pack_index) {
        if (builtin_locale_matches(language_packs[pack_index].locale, NULL)) continue;
        if (index == 0U) return language_packs[pack_index].locale;
        --index;
    }
    return NULL;
}

const char *link_i18n_installed_locale_name(size_t index)
{
    size_t builtin_count = link_i18n_supported_locale_count();
    if (index < builtin_count) {
        const char *locale = link_i18n_supported_locale(index);
        const LinkLanguagePack *pack = pack_find_const(locale);
        return pack != NULL ? pack->native_name : link_i18n_supported_locale_name(index);
    }
    {
        const char *locale = link_i18n_installed_locale(index);
        const LinkLanguagePack *pack = pack_find_const(locale);
        return pack != NULL ? pack->native_name : NULL;
    }
}

bool link_i18n_installed_locale_is_rtl(size_t index)
{
    const char *locale = link_i18n_installed_locale(index);
    const LinkLanguagePack *pack = pack_find_const(locale);
    if (pack != NULL) return pack->rtl;
    return locale != NULL && (locale[0] == 'a' || locale[0] == 'A') &&
           (locale[1] == 'r' || locale[1] == 'R') &&
           (locale[2] == '\0' || locale[2] == '-' || locale[2] == '_');
}

bool link_i18n_selected_locale_is_rtl(void)
{
    const char *locale = link_i18n_selected_locale();
    const LinkLanguagePack *pack = pack_find_const(locale);
    if (pack != NULL) return pack->rtl;
    return locale != NULL && (locale[0] == 'a' || locale[0] == 'A') &&
           (locale[1] == 'r' || locale[1] == 'R') &&
           (locale[2] == '\0' || locale[2] == '-' || locale[2] == '_');
}
'''
