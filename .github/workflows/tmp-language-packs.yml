name: Temporary language-pack implementation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-language-packs.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply language-pack implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp_language_packs.py')
          lines = p.read_text().splitlines()
          fixed = False
          for i, line in enumerate(lines):
              if line.strip().startswith('needle =') and 'ensure_locale' in line:
                  lines[i] = r'    needle = "    ensure_locale();\n    if (text == NULL) return \"\";\n"'
                  lines[i + 1] = r'    replacement = "    ensure_locale();\n    if (text == NULL) return \"\";\n    {\n        const char *packed_translation = link_i18n_text(text);\n        if (packed_translation != NULL && strcmp(packed_translation, text) != 0)\n            return packed_translation;\n    }\n"'
                  fixed = True
                  break
          if not fixed:
              raise SystemExit('GTK helper marker line not found')
          p.write_text('\n'.join(lines) + '\n')
          PY
          python3 tools/tmp_language_packs.py

      - name: Build and test
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DLINK_BUILD_REFERENCE_PRODUCT_FACES=OFF
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

      - name: Commit to main and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-language-packs.yml tools/tmp_language_packs.py
          git add -A
          git commit -m "Add discoverable Languages pack system"
          git push origin HEAD:main
          git push origin --delete tmp-i18n-15 || true
