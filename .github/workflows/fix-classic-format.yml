name: Temporary LINK dual-mode Bluetooth hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-classic-format.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libbluetooth-dev
      - name: Apply bounded adapter labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/linux/link-linux-serial.c')
          s = p.read_text()
          old_ble = '(void)snprintf(paths[written_count], 256U, "BLE:%s %s",'
          new_ble = '(void)snprintf(paths[written_count], 256U, "BLE:%.17s %.127s",'
          old_bt = '(void)snprintf(paths[written_count], 256U, "BT:%s %s",'
          new_bt = '(void)snprintf(paths[written_count], 256U, "BT:%.17s %.127s",'
          if old_ble not in s or old_bt not in s:
              raise SystemExit('expected Bluetooth label format not found')
          s = s.replace(old_ble, new_ble, 1).replace(old_bt, new_bt, 1)
          p.write_text(s)
          Path('VERSION').write_text('0.14.4\n')
          PY
      - name: Build and test
        run: |
          set -euo pipefail
          git diff --check
          cc -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wformat=2 -Wstrict-prototypes -Wmissing-prototypes -Werror $(pkg-config --cflags gio-2.0 bluez) -Iinclude -c platform/linux/link-linux-serial.c -o /tmp/link-linux-serial.o
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Publish hardened main
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-classic-format.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Release 0.14.4: harden dual-mode Bluetooth discovery formatting'
          git push origin HEAD:main
