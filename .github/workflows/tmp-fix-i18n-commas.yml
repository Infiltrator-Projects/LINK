name: Temporary localisation catalogue syntax repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-i18n-commas.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair catalogue separators
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/i18n.c')
          s = p.read_text(encoding='utf-8')
          old = '\n    ENTRY("linux.no_adapter"'
          count = s.count(old)
          if count != 13:
              raise SystemExit(f'expected 13 catalogue insertion points, found {count}')
          s = s.replace(old, ',\n    ENTRY("linux.no_adapter"')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-fix-i18n-commas.yml
          git diff --check
          git add -A
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git commit -m "Fix localisation catalogue separators"
          git push origin HEAD:main
