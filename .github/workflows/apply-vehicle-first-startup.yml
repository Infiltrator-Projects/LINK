name: Apply vehicle-first diagnostic startup

on:
  push:
    paths:
      - '.github/workflows/apply-vehicle-first-startup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply and test vehicle-first flow
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_vehicle_first.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add include/link/diagnostic_flow.h src/core/diagnostic_flow.c tests/test_diagnostic_flow.c
          git commit -m 'diagnostic flow: support VIN-first manufacturer startup'
          git push origin HEAD:main
