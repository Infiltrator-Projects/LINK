name: Temporary dual-mode Bluetooth repair

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-classic-bluetooth.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libbluetooth-dev
      - name: Apply transport repair
        run: |
          python3 .github/fix-classic-script.py
          python3 .github/apply-classic-bluetooth.py
      - name: Build and test
        run: |
          git diff --check
          cc -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wformat=2 -Wstrict-prototypes -Wmissing-prototypes -Werror $(pkg-config --cflags gio-2.0 bluez) -Iinclude -c platform/linux/link-linux-serial.c -o /tmp/link-linux-serial.o
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Publish repaired main
        run: |
          rm -f .github/workflows/add-classic-bluetooth.yml .github/apply-classic-bluetooth.py .github/fix-classic-script.py
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Release 0.14.3: native Bluetooth Classic SPP transport'
          git push origin HEAD:main
