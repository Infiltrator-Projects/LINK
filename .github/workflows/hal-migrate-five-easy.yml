name: HAL migrate five easy MBLINK behaviours

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-migrate-five-easy.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Move five generic Apple behaviours into LINK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          hpath = Path('platform/apple/LinkDiagnosticsController.h')
          h = hpath.read_text()
          marker = '''FOUNDATION_EXPORT NSArray<NSNumber *> *LinkVehicleProfileCachedPIDs(
              NSDictionary * _Nullable profile,
              uint32_t responderCANIdentifier,
              BOOL extendedID);
          '''
          addition = marker + '''
          /** Number of valid standard OBD responder records cached in a profile. */
          FOUNDATION_EXPORT NSUInteger LinkVehicleProfileStandardResponderCount(
              NSDictionary * _Nullable profile);
          '''
          if 'LinkVehicleProfileStandardResponderCount' not in h:
              if marker not in h:
                  raise SystemExit('cached PID declaration marker missing')
              h = h.replace(marker, addition, 1)

          store_decl = '''
          /**
           * Shared per-product standard PID selection persistence for Apple faces.
           * LINK owns both the global selection and VIN/controller-bounded choices;
           * product repositories retain only one-time migration rules for obsolete
           * product-specific defaults.
           */
          @interface LinkPIDSelectionStore : NSObject
          - (instancetype)initWithProductNamespace:(NSString *)productNamespace
                                   legacyGlobalKey:(NSString * _Nullable)legacyGlobalKey
                                  legacyVehicleKey:(NSString * _Nullable)legacyVehicleKey
              NS_DESIGNATED_INITIALIZER;
          - (instancetype)init NS_UNAVAILABLE;
          @property(nonatomic, readonly) BOOL hasGlobalSelection;
          @property(nonatomic, copy, readonly) NSArray<NSString *> *globalStableKeys;
          - (void)setGlobalStableKeys:(NSArray<NSString *> *)stableKeys;
          - (BOOL)hasSelectionForVIN:(NSString *)vin
                controllerIdentifier:(NSString *)controllerIdentifier;
          - (NSArray<NSString *> *)stableKeysForVIN:(NSString *)vin
                               controllerIdentifier:(NSString *)controllerIdentifier;
          - (void)setStableKeys:(NSArray<NSString *> *)stableKeys
                         forVIN:(NSString *)vin
           controllerIdentifier:(NSString *)controllerIdentifier;
          @end
          '''
          end_marker = '\n@end\n\nNS_ASSUME_NONNULL_END\n'
          if '@interface LinkPIDSelectionStore' not in h:
              if end_marker not in h:
                  raise SystemExit('LinkVehicleProfileStore end marker missing')
              h = h.replace(end_marker, '\n@end\n' + store_decl + '\nNS_ASSUME_NONNULL_END\n', 1)
          hpath.write_text(h)

          mpath = Path('platform/apple/LinkDiagnosticsController.m')
          m = mpath.read_text()
          impl_marker = '\n@implementation LinkVehicleProfileStore\n'
          responder_impl = '''
          NSUInteger LinkVehicleProfileStandardResponderCount(NSDictionary *profile)
          {
              if (![profile isKindOfClass:[NSDictionary class]]) return 0U;
              NSArray *responders = [profile[@"liveResponders"] isKindOfClass:[NSArray class]]
                  ? profile[@"liveResponders"] : @[];
              NSUInteger count = 0U;
              for (id value in responders) {
                  if ([value isKindOfClass:[NSDictionary class]]) ++count;
              }
              return count;
          }

          '''
          if 'NSUInteger LinkVehicleProfileStandardResponderCount' not in m:
              if impl_marker not in m:
                  raise SystemExit('vehicle profile implementation marker missing')
              m = m.replace(impl_marker, '\n' + responder_impl + '@implementation LinkVehicleProfileStore\n', 1)

          selection_impl = r'''

          #pragma mark - Shared standard PID selection persistence

          static NSArray<NSString *> *LinkSortedUniqueStableKeys(id raw)
          {
              if (![raw isKindOfClass:[NSArray class]]) return @[];
              NSMutableOrderedSet<NSString *> *values = [[NSMutableOrderedSet alloc] init];
              for (id value in (NSArray *)raw) {
                  if (![value isKindOfClass:[NSString class]]) continue;
                  NSString *key = [(NSString *)value
                      stringByTrimmingCharactersInSet:
                          [NSCharacterSet whitespaceAndNewlineCharacterSet]];
                  if (key.length != 0U) [values addObject:key];
              }
              return [[values array] sortedArrayUsingSelector:@selector(compare:)];
          }

          @interface LinkPIDSelectionStore ()
          @property(nonatomic, copy) NSString *globalKey;
          @property(nonatomic, copy) NSString *vehicleKey;
          @end

          @implementation LinkPIDSelectionStore

          - (instancetype)initWithProductNamespace:(NSString *)productNamespace
                                   legacyGlobalKey:(NSString *)legacyGlobalKey
                                  legacyVehicleKey:(NSString *)legacyVehicleKey
          {
              self = [super init];
              if (self == nil) return nil;
              NSString *name = [productNamespace
                  stringByTrimmingCharactersInSet:
                      [NSCharacterSet whitespaceAndNewlineCharacterSet]];
              if (name.length == 0U) name = @"default";
              name = name.lowercaseString;
              self.globalKey = [NSString stringWithFormat:
                  @"link.pidSelections.global.%@.v1", name];
              self.vehicleKey = [NSString stringWithFormat:
                  @"link.pidSelections.byVehicle.%@.v1", name];

              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              if ([defaults objectForKey:self.globalKey] == nil && legacyGlobalKey.length != 0U) {
                  id legacy = [defaults objectForKey:legacyGlobalKey];
                  if ([legacy isKindOfClass:[NSArray class]])
                      [defaults setObject:LinkSortedUniqueStableKeys(legacy) forKey:self.globalKey];
              }
              if ([defaults objectForKey:self.vehicleKey] == nil && legacyVehicleKey.length != 0U) {
                  NSDictionary *legacy = [defaults dictionaryForKey:legacyVehicleKey];
                  if (legacy != nil) [defaults setObject:legacy forKey:self.vehicleKey];
              }
              return self;
          }

          - (BOOL)hasGlobalSelection
          {
              return [[NSUserDefaults standardUserDefaults] objectForKey:self.globalKey] != nil;
          }

          - (NSArray<NSString *> *)globalStableKeys
          {
              return LinkSortedUniqueStableKeys(
                  [[NSUserDefaults standardUserDefaults] objectForKey:self.globalKey]);
          }

          - (void)setGlobalStableKeys:(NSArray<NSString *> *)stableKeys
          {
              [[NSUserDefaults standardUserDefaults]
                  setObject:LinkSortedUniqueStableKeys(stableKeys) forKey:self.globalKey];
          }

          - (NSDictionary *)storedVehicleSelections
          {
              NSDictionary *stored = [[NSUserDefaults standardUserDefaults]
                  dictionaryForKey:self.vehicleKey];
              return stored != nil ? stored : @{};
          }

          - (BOOL)hasSelectionForVIN:(NSString *)vin
                controllerIdentifier:(NSString *)controllerIdentifier
          {
              if (vin.length != 17U || controllerIdentifier.length == 0U) return NO;
              NSDictionary *vehicle = [self.storedVehicleSelections[vin]
                  isKindOfClass:[NSDictionary class]]
                  ? self.storedVehicleSelections[vin] : nil;
              return vehicle != nil && vehicle[controllerIdentifier] != nil;
          }

          - (NSArray<NSString *> *)stableKeysForVIN:(NSString *)vin
                               controllerIdentifier:(NSString *)controllerIdentifier
          {
              if (vin.length != 17U || controllerIdentifier.length == 0U) return @[];
              NSDictionary *vehicle = [self.storedVehicleSelections[vin]
                  isKindOfClass:[NSDictionary class]]
                  ? self.storedVehicleSelections[vin] : @{};
              return LinkSortedUniqueStableKeys(vehicle[controllerIdentifier]);
          }

          - (void)setStableKeys:(NSArray<NSString *> *)stableKeys
                         forVIN:(NSString *)vin
           controllerIdentifier:(NSString *)controllerIdentifier
          {
              if (vin.length != 17U || controllerIdentifier.length == 0U) return;
              NSMutableDictionary *root = [self.storedVehicleSelections mutableCopy];
              NSDictionary *existing = [root[vin] isKindOfClass:[NSDictionary class]]
                  ? root[vin] : @{};
              NSMutableDictionary *vehicle = [existing mutableCopy];
              vehicle[controllerIdentifier] = LinkSortedUniqueStableKeys(stableKeys);
              root[vin] = [vehicle copy];
              [[NSUserDefaults standardUserDefaults] setObject:[root copy]
                                                         forKey:self.vehicleKey];
          }

          @end
          '''
          if '@implementation LinkPIDSelectionStore' not in m:
              m = m.rstrip() + selection_impl + '\n'
          mpath.write_text(m)

          spath = Path('platform/apple/LinkDiagnosticUI.swift')
          s = spath.read_text()
          language_marker = 'enum LinkDiagnosticTask: CaseIterable {'
          language_model = r'''struct LinkInterfaceLanguage: Identifiable, Hashable {
              let id: String
              let nativeName: String

              static let all: [LinkInterfaceLanguage] = {
                  let count = Int(link_i18n_supported_locale_count())
                  return (0..<count).compactMap { index in
                      guard let locale = link_i18n_supported_locale(index),
                            let name = link_i18n_supported_locale_name(index) else { return nil }
                      return LinkInterfaceLanguage(
                          id: String(cString: locale),
                          nativeName: String(cString: name))
                  }
              }()

              static func canonical(
                  _ stored: String,
                  aliases: [String: String] = [:],
                  fallback: String = "en-AU"
              ) -> String {
                  let candidate = aliases[stored] ?? stored
                  return all.contains(where: { $0.id == candidate }) ? candidate : fallback
              }

              static func displayName(
                  for stored: String,
                  aliases: [String: String] = [:],
                  fallback: String = "en-AU"
              ) -> String {
                  let code = canonical(stored, aliases: aliases, fallback: fallback)
                  return all.first(where: { $0.id == code })?.nativeName
                      ?? all.first(where: { $0.id == fallback })?.nativeName
                      ?? fallback
              }
          }

          '''
          if 'struct LinkInterfaceLanguage:' not in s:
              if language_marker not in s:
                  raise SystemExit('LinkDiagnosticTask marker missing')
              s = s.replace(language_marker, language_model + language_marker, 1)

          summary_old = '''struct LinkSavedVehicleProfileSummary: Identifiable {
              let id: String
              let vin: String
              let displayName: String
              let moduleCount: Int
              let responderCount: Int
              let updatedAt: Date?
          }
          '''
          summary_new = '''struct LinkSavedVehicleProfileSummary: Identifiable {
              let id: String
              let vin: String
              let displayName: String
              let moduleCount: Int
              let responderCount: Int
              let updatedAt: Date?

              init(
                  id: String,
                  vin: String,
                  displayName: String,
                  moduleCount: Int,
                  responderCount: Int,
                  updatedAt: Date?
              ) {
                  self.id = id
                  self.vin = vin
                  self.displayName = displayName
                  self.moduleCount = moduleCount
                  self.responderCount = responderCount
                  self.updatedAt = updatedAt
              }

              init?(
                  profile: NSDictionary,
                  moduleCount: Int,
                  fallbackDisplayName: String
              ) {
                  guard let vin = profile["vin"] as? String, vin.count == 17 else {
                      return nil
                  }
                  let displayName = (profile["displayName"] as? String)
                      ?? fallbackDisplayName
                  let timestamp = (profile["updatedAt"] as? NSNumber)?.doubleValue
                  self.init(
                      id: vin,
                      vin: vin,
                      displayName: displayName,
                      moduleCount: moduleCount,
                      responderCount: Int(LinkVehicleProfileStandardResponderCount(profile)),
                      updatedAt: timestamp.map { Date(timeIntervalSince1970: $0) })
              }
          }
          '''
          if 'fallbackDisplayName: String' not in s:
              if summary_old not in s:
                  raise SystemExit('saved profile summary marker missing')
              s = s.replace(summary_old, summary_new, 1)
          spath.write_text(s)
          PY

          git diff --check

      - name: Validate portable LINK build and tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          rm -rf build

      - name: Publish permanent LINK migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hal-migrate-five-easy.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git commit -m "Move five small Apple behaviours into LINK"
          git push origin HEAD:main
