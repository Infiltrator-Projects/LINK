name: One-shot LINK GTK navigation icons 0.15.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-link-nav-icons-0.15.2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Add product-owned GTK navigation icon hook and release 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path('platform/linux/link-gtk-shell.h')
          s = header.read_text()
          old = '''    const char *version;\n    const char *emblem_resource;\n    const char *css;\n'''
          new = '''    const char *version;\n    const char *emblem_resource;\n    /*\n     * Optional product-owned icon for each LINK workspace destination.\n     * Return a GResource path for the section or NULL for text-only navigation.\n     * LINK owns layout/sizing; the product owns the artwork.\n     */\n    const char *(*navigation_icon_resource)(size_t section, void *context);\n    const char *css;\n'''
          if s.count(old) != 1:
              raise SystemExit('Unexpected LinkGtkShellDescriptor layout')
          header.write_text(s.replace(old, new, 1))

          source = Path('platform/linux/link-gtk-shell.c')
          s = source.read_text()
          css_old = '    ".link-nav-row { margin: 3px 0; padding: 6px 8px; border-radius: 10px; border: 1px solid transparent; background: transparent; }"\n'
          css_new = css_old + '    ".link-nav-row-content { min-height: 42px; }"\n    ".link-nav-icon { min-width: 26px; min-height: 26px; }"\n'
          if s.count(css_old) != 1:
              raise SystemExit('Unexpected GTK navigation CSS')
          s = s.replace(css_old, css_new, 1)

          nav_old = '''        GtkWidget *row;\n        GtkWidget *box;\n        if (section == NULL) continue;\n        row = gtk_list_box_row_new();\n        box = gtk_box_new(GTK_ORIENTATION_VERTICAL, 2);\n        gtk_widget_add_css_class(row, "link-nav-row");\n        gtk_box_append(GTK_BOX(box), left_label(section->title, "link-section-title"));\n        gtk_box_append(GTK_BOX(box), left_label(section->summary, "link-section-summary"));\n        gtk_list_box_row_set_child(GTK_LIST_BOX_ROW(row), box);\n'''
          nav_new = '''        GtkWidget *row;\n        GtkWidget *box;\n        GtkWidget *row_content;\n        const char *icon_resource = NULL;\n        if (section == NULL) continue;\n        row = gtk_list_box_row_new();\n        row_content = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 10);\n        box = gtk_box_new(GTK_ORIENTATION_VERTICAL, 2);\n        gtk_widget_add_css_class(row, "link-nav-row");\n        gtk_widget_add_css_class(row_content, "link-nav-row-content");\n        if (shell->descriptor->navigation_icon_resource != NULL)\n            icon_resource = shell->descriptor->navigation_icon_resource(\n                index, shell->descriptor->context);\n        if (icon_resource != NULL && icon_resource[0] != '\\0') {\n            GtkWidget *icon = gtk_image_new_from_resource(icon_resource);\n            gtk_image_set_pixel_size(GTK_IMAGE(icon), 26);\n            gtk_widget_set_valign(icon, GTK_ALIGN_CENTER);\n            gtk_widget_add_css_class(icon, "link-nav-icon");\n            gtk_box_append(GTK_BOX(row_content), icon);\n        }\n        gtk_widget_set_hexpand(box, TRUE);\n        gtk_box_append(GTK_BOX(box), left_label(section->title, "link-section-title"));\n        gtk_box_append(GTK_BOX(box), left_label(section->summary, "link-section-summary"));\n        gtk_box_append(GTK_BOX(row_content), box);\n        gtk_list_box_row_set_child(GTK_LIST_BOX_ROW(row), row_content);\n'''
          if s.count(nav_old) != 1:
              raise SystemExit('Unexpected GTK navigation builder')
          source.write_text(s.replace(nav_old, nav_new, 1))

          version = Path('VERSION')
          if version.read_text().strip() != '0.15.1':
              raise SystemExit(f'Unexpected VERSION: {version.read_text()!r}')
          version.write_text('0.15.2\n')

          vh = Path('include/link/version.h')
          v = vh.read_text()
          old_v = '#define LINK_VERSION_STRING "0.15.1"'
          if v.count(old_v) != 1:
              raise SystemExit('Unexpected LINK version header')
          vh.write_text(v.replace(old_v, '#define LINK_VERSION_STRING "0.15.2"', 1))
          PY
          git rm .github/workflows/one-shot-link-nav-icons-0.15.2.yml
          git diff --check
          grep -Fq 'navigation_icon_resource' platform/linux/link-gtk-shell.h
          grep -Fq 'gtk_image_new_from_resource(icon_resource)' platform/linux/link-gtk-shell.c
          test "$(tr -d '[:space:]' < VERSION)" = '0.15.2'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.15.2: allow product navigation icons on GTK'
          git push origin HEAD:main
