name: HAL publish five easy migrations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-publish-five-easy.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply validated migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/hal-migrate-five-easy.yml').read_text()
          body = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Validate LINK
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          rm -rf build
      - name: Publish source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add platform/apple/LinkDiagnosticsController.h \
                  platform/apple/LinkDiagnosticsController.m \
                  platform/apple/LinkDiagnosticUI.swift
          git diff --cached --check
          git commit -m "Move five small Apple behaviours into LINK"
          git push origin HEAD:main
