name: Temporary live-data label localisation repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-localise-parameter-labels.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply and validate localisation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_localise_parameter_labels.py
          rm -f scripts/tmp_localise_parameter_labels.py
          rm -f .github/workflows/tmp-localise-parameter-labels.yml
          git diff --check
          cmake -S . -B build-localisation -DCMAKE_BUILD_TYPE=Release
          cmake --build build-localisation --parallel
          ctest --test-dir build-localisation --output-on-failure
          git add -A
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git commit -m "Release 0.13.7: localise shared live-data parameter labels"
          git push origin HEAD:main
