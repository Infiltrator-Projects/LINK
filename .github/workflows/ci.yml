name: LINK CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / strict C11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [linux-native, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce main-only automatic release policy
        shell: bash
        run: |
          set -euo pipefail
          release=.github/workflows/release.yml
          test -f "$release"
          test ! -e .github/workflows/auto-release.yml
          grep -Fq '  workflow_run:' "$release"
          grep -Fq 'workflows: ["LINK CI"]' "$release"
          grep -Fq "startsWith(github.event.workflow_run.head_commit.message, 'Release ')" "$release"
          grep -Fq 'github.event.workflow_run.head_branch == '\''main'\''' "$release"
          grep -Fq 'published releases are immutable' "$release"
          grep -Fq 'gh release create "$TAG"' "$release"
          grep -Fq -- '--target "$head_commit" --draft' "$release"
          grep -Fq 'gh release upload "$TAG"' "$release"
          grep -Fq 'gh release edit "$TAG"' "$release"
          grep -Fq -- '--draft=false' "$release"
          if grep -Fq 'git push origin "$TAG"' "$release"; then
            echo "LINK must not expose an immutable tag before every asset is verified." >&2
            exit 1
          fi
          if grep -Eq '^  (pull_request|merge_group|schedule):' .github/workflows/ci.yml; then
            echo "LINK CI must run from main only." >&2
            exit 1
          fi
          if grep -Eq '^  workflow_dispatch:' "$release"; then
            echo "LINK release publication must not require manual approval." >&2
            exit 1
          fi

      - name: Keep Release tests executable
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn --include='*.c' --include='*.h' \
              -e '#[[:space:]]*include[[:space:]]*<assert\.h>' \
              -e '(^|[^[:alnum:]_])assert[[:space:]]*\(' tests; then
            echo "LINK tests must not depend on assert(); Release builds define NDEBUG." >&2
            exit 1
          fi

      - name: Initialise and verify exact Common dependency
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init src/infiltratr-common
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.15.4"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "046406bea2aefa539c74e1038b6c20825eca8af7"

      - name: Enforce transport and evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LinkRecoveryAttemptLimit' platform/apple/LinkBLETransport.m
          grep -Fq '_recoveryAttempt > LinkRecoveryAttemptLimit' platform/apple/LinkBLETransport.m
          grep -Fq 'retry limit reached' platform/apple/LinkBLETransport.m
          grep -Fq 'LinkScanAttemptLimit = 4U' platform/apple/LinkBLETransport.m
          grep -Fq 'LinkKnownPeripheralConnectTimeoutSeconds = 3.0' platform/apple/LinkBLETransport.m
          grep -Fq 'Saved BLE adapter did not answer yet; scanning' platform/apple/LinkBLETransport.m
          grep -Fq 'retrievePeripheralsWithIdentifiers' platform/apple/LinkBLETransport.m
          grep -Fq 'LinkKnownPeripheralDefaultsKey' platform/apple/LinkBLETransport.m
          grep -Fq 'link_telemetry_recorder_begin(' platform/apple/LinkDiagnosticsController.m
          grep -Fq '"BLE", stateName.UTF8String' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'LinkBLETransportStateFailed' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'case LINK_DIAGNOSTIC_FLOW_EVENT_LIVE_STRUCTURED:' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'event.kind == LINK_DIAGNOSTIC_FLOW_EVENT_LIVE_STRUCTURED' platform/linux/link-gtk-shell.c
          grep -Fq 'LINK_ADAPTER_KIND_MERCEDES_ME_NATIVE' include/link/transport.h
          grep -Fq 'link_adapter_kind_from_bluetooth_name' src/core/transport.c
          grep -Fq 'LINK_MERCEDES_ME_NUS_SERVICE_UUID' include/link/mercedes_me_adapter.h
          grep -Fq 'LINK_MERCEDES_ME_REFERENCE_CLASSIC_CONNECT_TIMEOUT_MS 44000U' include/link/mercedes_me_adapter.h
          grep -Fq 'link_mercedes_me_adapter_family_from_name' src/core/mercedes_me_adapter.c
          grep -Fq 'link_mercedes_me_data_id_count' src/core/mercedes_me_data_ids.c
          grep -Fq 'link-test-mercedes-me-data-ids tests/test_mercedes_me_data_ids.c link-mercedes-me-data-ids' CMakeLists.txt
          grep -Fq 'link_mercedes_me_diaglogic_decode_vehicle_status' src/core/mercedes_me_diaglogic.c
          grep -Fq 'link-test-mercedes-me-diaglogic tests/test_mercedes_me_diaglogic.c link-mercedes-me-diaglogic' CMakeLists.txt
          grep -Fq '**194 exact static data-ID symbol/literal pairs**' docs/MERCEDES-ME-DATA-IDS.md
          grep -Fq 'link-test-mercedes-me-adapter tests/test_mercedes_me_adapter.c link-mercedes-me-adapter' CMakeLists.txt
          grep -Fq 'link-test-mercedes-me-native-protocol tests/test_mercedes_me_native_protocol.c link-mercedes-me-native-protocol' CMakeLists.txt
          grep -Fq 'link_mercedes_me_secure_encode' src/core/mercedes_me_native_protocol.c
          grep -Fq 'LINK_MERCEDES_ME_SECURE_MAX_PLAINTEXT 505U' include/link/mercedes_me_native_protocol.h
          grep -Fq 'link_mercedes_me_diaglogic_reference_policy' src/core/mercedes_me_diaglogic.c
          grep -Fq 'link-test-mercedes-me-whisper tests/test_mercedes_me_whisper.c link-mercedes-me-whisper' CMakeLists.txt
          grep -Fq 'SELECT_LOWEST_CANID_CACHED' src/core/mercedes_me_whisper.c
          grep -Fq 'docs/MERCEDES-ME-NATIVE-BINARIES.md' README.md
          grep -Fq 'docs/MERCEDES-ME-ADAPTER-INTEROP.md' README.md
          grep -Fq 'link_linux_serial_probe_adapter' platform/linux/link-gtk-shell.c
          grep -Fq 'bool use_client_side_titlebar;' platform/linux/link-gtk-shell.h
          if grep -Fq 'adapter_combo_width' platform/linux/link-gtk-shell.h; then
            echo 'Adapter-selector geometry must be LINK-owned, not product-configurable.' >&2
            exit 1
          fi
          grep -Fq 'gtk_widget_set_hexpand(shell->device_combo, TRUE);' platform/linux/link-gtk-shell.c
          grep -Fq 'gtk_widget_set_halign(shell->device_combo, GTK_ALIGN_FILL);' platform/linux/link-gtk-shell.c
          grep -Fq '.link-card { border: 1px solid transparent; border-radius: 18px; padding: 20px; }' platform/linux/link-gtk-shell.c
          grep -Fq '.link-link-button { min-width: 92px; padding: 7px 18px; border-radius: 10px; font-size: 13px; font-weight: 800; }' platform/linux/link-gtk-shell.c
          grep -Fq 'gtk_window_set_titlebar(shell->window, titlebar);' platform/linux/link-gtk-shell.c
          grep -Fq 'gtk_header_bar_set_show_title_buttons(GTK_HEADER_BAR(titlebar), TRUE);' platform/linux/link-gtk-shell.c
          grep -Fq 'gtk_widget_add_css_class(device_row, "link-device-row");' platform/linux/link-gtk-shell.c
          grep -Fq 'native protocol capture' platform/linux/link-gtk-shell.c
          grep -Fq 'transport.isNativeAdapter' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'case settings' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'linkDiagnosticLocalization' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'setSelectedLanguageTag' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'setSelectedMeasurementSystemKey' platform/apple/LinkDiagnosticsController.m
          ! grep -Fq 'LinkDiagnosticSettingsView' platform/apple/LinkDiagnosticUI.swift
          ! grep -Fq 'preferFavouriteSignals' platform/apple/LinkDiagnosticsController.h
          ! grep -Fq 'showUnavailableParameters' platform/apple/LinkDiagnosticsController.h
          ! grep -Fq 'settings.prefer_favourites' src/core/i18n.c
          ! grep -Fq 'settings.show_unavailable' src/core/i18n.c
          grep -Fq 'return @[@"metric", @"us-customary"];' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'src/core/units.c' CMakeLists.txt
          grep -Fq 'link-test-units tests/test_units.c link-units' CMakeLists.txt
          grep -Fq 'NATIVE_RX' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'link-test-uds-dtc tests/test_uds_dtc.c link-uds-dtc' CMakeLists.txt
          grep -Fq 'link-test-uds-server tests/test_uds_server.c link-uds-server' CMakeLists.txt
          grep -Fq 'link-test-stm32-uds-server' CMakeLists.txt
          grep -Fq 'request_can_id = 0x7e0U' examples/stm32c092/issue-38-server/Src-main.c
          grep -Fq 'link_stm32c092_hal_start_standard_dual' examples/stm32c092/link-stm32c092-hal.c
          grep -Fq 'link-test-stm32-bxcan-hal' CMakeLists.txt
          grep -Fq 'link_stm32_bxcan_hal_start_standard_dual' examples/stm32-bxcan/link-stm32-bxcan-hal.c
          grep -Fq 'STM32F103, STM32F107 and STM32F767' examples/stm32-bxcan/README.md
          grep -Fq 'functional_address_enabled' platform/stm32/link-stm32-uds-server.h
          grep -Fq 'nrc == UINT8_C(0x31)' platform/stm32/link-stm32-uds-server.c
          grep -Fq 'request.can_id = 0x7dfU' tests/test_stm32_uds_server.c
          if grep -REn '\?[[:space:]]*:' platform/apple; then
            echo 'Apple platform code must not use the GNU omitted-middle ?: extension.' >&2
            exit 1
          fi

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extra+=( -DLINK_BUILD_REFERENCE_PRODUCT_FACES=ON )
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Verify installed CMake package from an external consumer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/link-install"
          cmake --install build --prefix "$prefix"
          cmake -S tests/cmake-consumer -B package-consumer \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build package-consumer --parallel
          ./package-consumer/link-package-consumer

      - name: Verify one shared scanner implementation produces both product faces
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mb = Get-ChildItem -Path build -Recurse -Filter mblink-discover.exe | Select-Object -First 1
          $jag = Get-ChildItem -Path build -Recurse -Filter jaglink-discover.exe | Select-Object -First 1
          if (-not $mb) { throw 'mblink-discover.exe was not produced by LINK' }
          if (-not $jag) { throw 'jaglink-discover.exe was not produced by LINK' }
          if (-not (Test-Path platform/windows/link-discover.c)) { throw 'shared scanner backend is missing' }
          if (-not (Test-Path platform/windows/link-discover-ui.c)) { throw 'shared scanner UI shell is missing' }
          Write-Host "MBLINK face: $($mb.FullName)"
          Write-Host "JAGLINK face: $($jag.FullName)"

  linux-native-adapters:
    name: Ubuntu / native Linux adapter providers
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native transport build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libbluetooth-dev libglib2.0-dev libusb-1.0-0-dev pkg-config
      - name: Bootstrap libusb development files for self-hosted Linux
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if pkg-config --exists libusb-1.0; then
            exit 0
          fi
          root="$RUNNER_TEMP/libusb-dev"
          dl="$RUNNER_TEMP/libusb-download"
          rm -rf "$root" "$dl"
          mkdir -p "$root" "$dl"
          cd "$dl"
          apt-get download libusb-1.0-0 libusb-1.0-0-dev
          for deb in ./*.deb; do
            dpkg-deb -x "$deb" "$root"
          done
          pc="$(find "$root/usr/lib" -path '*/pkgconfig/libusb-1.0.pc' -print -quit)"
          test -n "$pc"
          sed -i "s|^prefix=/usr$|prefix=$root/usr|" "$pc"
          libdir="$(dirname "$(dirname "$pc")")"
          echo "PKG_CONFIG_PATH=$(dirname "$pc")${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Initialise Common
        shell: bash
        run: git submodule update --init src/infiltratr-common
      - name: Configure native provider ownership smoke
        run: cmake -S . -B build-linux-providers -DCMAKE_BUILD_TYPE=Release -DLINK_BUILD_LINUX_PROVIDER_SMOKE=ON -DBUILD_TESTING=ON
      - name: Compile native providers
        run: cmake --build build-linux-providers --target link-linux-provider-smoke link-test-linux-openport2-status --parallel
      - name: Verify OpenPort receive-status regression
        run: ctest --test-dir build-linux-providers -R '^link-linux-openport2-status$' --output-on-failure

  stm32-arm-cross:
    name: STM32 / Cortex-M cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialise Common
        shell: bash
        run: git submodule update --init src/infiltratr-common
      - name: Install ARM embedded GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Cross-compile STM32C092 source set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-stm32-arm
          flags=(
            -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding
            -Wall -Wextra -Wpedantic -Wshadow -Wformat=2
            -Wstrict-prototypes -Wmissing-prototypes -Werror
            -Iinclude -Iplatform/stm32 -Iexamples/stm32c092
            -Itests/stm32c092_hal_stub -Isrc/infiltratr-common/include
          )
          sources=(
            src/core/isotp.c
            src/uds/uds.c
            src/uds/uds_services.c
            src/uds/uds_server.c
            src/infiltratr-common/src/core.c
            platform/stm32/link-stm32-can.c
            platform/stm32/link-stm32-uds.c
            platform/stm32/link-stm32-uds-server.c
            examples/stm32c092/link-stm32c092-hal.c
            examples/stm32c092/link-stm32c092-example.c
            examples/stm32c092/link-stm32c092-server-example.c
          )
          for source in "${sources[@]}"; do
            object="build-stm32-arm/$(printf '%s' "$source" | tr '/.' '__').o"
            arm-none-eabi-gcc "${flags[@]}" -c "$source" -o "$object"
          done
          arm-none-eabi-size build-stm32-arm/*.o

      - name: Cross-compile STM32F103/F107/F767 bxCAN source set
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            src/core/isotp.c
            src/uds/uds.c
            src/uds/uds_services.c
            src/infiltratr-common/src/core.c
            platform/stm32/link-stm32-can.c
            platform/stm32/link-stm32-uds.c
            examples/stm32-bxcan/link-stm32-bxcan-hal.c
            examples/stm32-bxcan/link-stm32-bxcan-example.c
          )
          for cpu in cortex-m3 cortex-m7; do
            output="build-stm32-bxcan-${cpu}"
            mkdir -p "$output"
            flags=(
              "-mcpu=${cpu}" -mthumb -std=c11 -ffreestanding
              -Wall -Wextra -Wpedantic -Wshadow -Wformat=2
              -Wstrict-prototypes -Wmissing-prototypes -Werror
              -Iinclude -Iplatform/stm32 -Iexamples/stm32-bxcan
              -Itests/stm32_bxcan_hal_stub -Isrc/infiltratr-common/include
            )
            for source in "${sources[@]}"; do
              object="$output/$(printf '%s' "$source" | tr '/.' '__').o"
              arm-none-eabi-gcc "${flags[@]}" -c "$source" -o "$object"
            done
            arm-none-eabi-size "$output"/*.o
          done

  sanitizers:
    name: Local Linux / ASan + UBSan
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialise Common
        shell: bash
        run: git submodule update --init src/infiltratr-common
      - name: Configure sanitizers
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DLINK_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-sanitized --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
