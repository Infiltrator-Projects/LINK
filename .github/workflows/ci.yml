# SPDX-License-Identifier: GPL-3.0-or-later
name: LINK CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / strict C11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce main-only automatic release policy
        shell: bash
        run: |
          set -euo pipefail
          release=.github/workflows/release.yml
          test -f "$release"
          test ! -e .github/workflows/auto-release.yml
          grep -Fq '  workflow_run:' "$release"
          grep -Fq 'workflows: ["LINK CI"]' "$release"
          grep -Fq "startsWith(github.event.workflow_run.head_commit.message, 'Release ')" "$release"
          grep -Fq 'github.event.workflow_run.head_branch == '\''main'\''' "$release"
          grep -Fq 'published releases are immutable' "$release"
          if grep -Eq '^  (pull_request|merge_group|schedule):' .github/workflows/ci.yml; then
            echo "LINK CI must run from main only." >&2
            exit 1
          fi
          if grep -Eq '^  workflow_dispatch:' "$release"; then
            echo "LINK release publication must not require manual approval." >&2
            exit 1
          fi

      - name: Keep Release tests executable
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn --include='*.c' --include='*.h' \
              -e '#[[:space:]]*include[[:space:]]*<assert\.h>' \
              -e '(^|[^[:alnum:]_])assert[[:space:]]*\(' tests; then
            echo "LINK tests must not depend on assert(); Release builds define NDEBUG." >&2
            exit 1
          fi

      - name: Initialise and verify exact Common dependency
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init src/infiltratr-common
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.11.2"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "b23a9d086ea323c0c6157dea3dd24db635b007c7"

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extra+=( -DLINK_BUILD_REFERENCE_PRODUCT_FACES=ON )
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Verify installed CMake package from an external consumer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/link-install"
          cmake --install build --prefix "$prefix"
          cmake -S tests/cmake-consumer -B package-consumer \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build package-consumer --parallel
          ./package-consumer/link-package-consumer

      - name: Verify one shared scanner implementation produces both product faces
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mb = Get-ChildItem -Path build -Recurse -Filter mblink-discover.exe | Select-Object -First 1
          $jag = Get-ChildItem -Path build -Recurse -Filter jaglink-discover.exe | Select-Object -First 1
          if (-not $mb) { throw 'mblink-discover.exe was not produced by LINK' }
          if (-not $jag) { throw 'jaglink-discover.exe was not produced by LINK' }
          if (-not (Test-Path platform/windows/link-discover.c)) { throw 'shared scanner backend is missing' }
          if (-not (Test-Path platform/windows/link-discover-ui.c)) { throw 'shared scanner UI shell is missing' }
          Write-Host "MBLINK face: $($mb.FullName)"
          Write-Host "JAGLINK face: $($jag.FullName)"

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialise Common
        shell: bash
        run: git submodule update --init src/infiltratr-common
      - name: Configure sanitizers
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DLINK_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-sanitized --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
