name: HAL Apple picker presentation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot Apple picker presentation fix'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply guarded quick wins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3a60c45415273c8e91c7a5a887bb04ad787c80f6"
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('platform/apple/LinkDiagnosticUI.swift')
          text = ui.read_text()

          old_connect = '''        LinkConnectionPresentation.presentPicker(
              vehicleText: currentVehicleText,
              knownAdapterIdentifier: knownAdapter) { [weak self] source in
                  self?.beginConnection(source)
              }
          '''
          new_connect = '''        LinkConnectionPresentation.presentPicker(
              vehicleText: currentVehicleText,
              knownAdapterIdentifier: knownAdapter,
              unavailable: { [weak self] in
                  self?.statusText =
                      "Unable to open adapter picker · try Connect again"
              }) { [weak self] source in
                  self?.beginConnection(source)
              }
          '''
          if text.count(old_connect) != 1:
              raise SystemExit(f'connect picker call guard failed: {text.count(old_connect)} matches')
          text = text.replace(old_connect, new_connect)

          old_presentation = '''enum LinkConnectionPresentation {
              static func presentPicker(
                  vehicleText: String,
                  knownAdapterIdentifier: String?,
                  selection: @escaping (LinkConnectionSource) -> Void
              ) {
                  guard let presenter = presentingViewController() else {
                      selection(.automatic)
                      return
                  }
                  let picker = LinkConnectionPickerViewController(
                      vehicleText: vehicleText,
                      knownAdapterIdentifier: knownAdapterIdentifier) { source in
                          Task { @MainActor in selection(source) }
                      }
                  let navigation = UINavigationController(rootViewController: picker)
                  navigation.modalPresentationStyle = .pageSheet
                  presenter.present(navigation, animated: true)
              }
          '''
          new_presentation = '''enum LinkConnectionPresentation {
              static func presentPicker(
                  vehicleText: String,
                  knownAdapterIdentifier: String?,
                  unavailable: @escaping () -> Void,
                  selection: @escaping (LinkConnectionSource) -> Void
              ) {
                  presentPicker(
                      vehicleText: vehicleText,
                      knownAdapterIdentifier: knownAdapterIdentifier,
                      remainingPresentationAttempts: 3,
                      unavailable: unavailable,
                      selection: selection)
              }

              private static func presentPicker(
                  vehicleText: String,
                  knownAdapterIdentifier: String?,
                  remainingPresentationAttempts: Int,
                  unavailable: @escaping () -> Void,
                  selection: @escaping (LinkConnectionSource) -> Void
              ) {
                  guard let presenter = presentingViewController() else {
                      guard remainingPresentationAttempts > 0 else {
                          unavailable()
                          return
                      }
                      Task { @MainActor in
                          try? await Task<Never, Never>.sleep(
                              nanoseconds: 100_000_000)
                          presentPicker(
                              vehicleText: vehicleText,
                              knownAdapterIdentifier: knownAdapterIdentifier,
                              remainingPresentationAttempts:
                                  remainingPresentationAttempts - 1,
                              unavailable: unavailable,
                              selection: selection)
                      }
                      return
                  }
                  let picker = LinkConnectionPickerViewController(
                      vehicleText: vehicleText,
                      knownAdapterIdentifier: knownAdapterIdentifier) { source in
                          Task { @MainActor in selection(source) }
                      }
                  let navigation = UINavigationController(rootViewController: picker)
                  navigation.modalPresentationStyle = .pageSheet
                  presenter.present(navigation, animated: true)
              }
          '''
          if text.count(old_presentation) != 1:
              raise SystemExit(f'presentation guard failed: {text.count(old_presentation)} matches')
          text = text.replace(old_presentation, new_presentation)
          ui.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          anchor = "          grep -Fq 'enum LinkConnectionPresentation' platform/apple/LinkDiagnosticUI.swift\n"
          addition = anchor + "          grep -Fq 'remainingPresentationAttempts: 3' platform/apple/LinkDiagnosticUI.swift\n          grep -Fq 'unavailable: @escaping () -> Void' platform/apple/LinkDiagnosticUI.swift\n          grep -Fq 'Unable to open adapter picker · try Connect again' platform/apple/LinkDiagnosticUI.swift\n          if grep -Fq 'selection(.automatic)' platform/apple/LinkDiagnosticUI.swift; then\n            echo 'Apple Connect must not silently switch to automatic scan when the picker cannot be presented.' >&2\n            exit 1\n          fi\n          grep -Fq 'const BOOL explicitlySelected =' platform/apple/LinkBLETransport.m\n          grep -Fq '!explicitlySelected &&' platform/apple/LinkBLETransport.m\n"
          if ci_text.count(anchor) != 1:
              raise SystemExit(f'CI anchor guard failed: {ci_text.count(anchor)} matches')
          ci.write_text(ci_text.replace(anchor, addition))

          version = Path('VERSION')
          if version.read_text().strip() != '0.15.12':
              raise SystemExit('unexpected LINK VERSION')
          version.write_text('0.15.13\n')

          header = Path('include/link/version.h')
          header_text = header.read_text()
          if header_text.count('#define LINK_VERSION_STRING "0.15.12"') != 1:
              raise SystemExit('version header guard failed')
          header.write_text(header_text.replace(
              '#define LINK_VERSION_STRING "0.15.12"',
              '#define LINK_VERSION_STRING "0.15.13"'))
          PY

          rm .github/workflows/hal-picker-presentation-fix.yml

          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Apple picker presentation fallback" -m "Retry briefly when UIKit has not exposed a foreground presenter instead of silently changing an explicit Connect action into automatic adapter discovery. Surface a truthful retry message if presentation remains unavailable. Add CI guards for this contract and for the explicit BLE UUID transport path, then bump LINK to 0.15.13."
          git push origin HEAD:main
