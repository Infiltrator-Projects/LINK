name: HAL Apple picker presentation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply picker fix without CI mutation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply guarded product fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d5bfd3f5147a352830a6baa9e7eec36b5ce0ac51"
          test "$(git rev-parse HEAD~4)" = "3a60c45415273c8e91c7a5a887bb04ad787c80f6"
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('platform/apple/LinkDiagnosticUI.swift')
          text = ui.read_text()

          old_connect = "\n".join([
              "        LinkConnectionPresentation.presentPicker(",
              "            vehicleText: currentVehicleText,",
              "            knownAdapterIdentifier: knownAdapter) { [weak self] source in",
              "                self?.beginConnection(source)",
              "            }",
          ]) + "\n"
          new_connect = "\n".join([
              "        LinkConnectionPresentation.presentPicker(",
              "            vehicleText: currentVehicleText,",
              "            knownAdapterIdentifier: knownAdapter,",
              "            unavailable: { [weak self] in",
              "                self?.statusText =",
              "                    \"Unable to open adapter picker · try Connect again\"",
              "            }) { [weak self] source in",
              "                self?.beginConnection(source)",
              "            }",
          ]) + "\n"
          if text.count(old_connect) != 1:
              raise SystemExit(f'connect picker call guard failed: {text.count(old_connect)} matches')
          text = text.replace(old_connect, new_connect)

          old_presentation = "\n".join([
              "enum LinkConnectionPresentation {",
              "    static func presentPicker(",
              "        vehicleText: String,",
              "        knownAdapterIdentifier: String?,",
              "        selection: @escaping (LinkConnectionSource) -> Void",
              "    ) {",
              "        guard let presenter = presentingViewController() else {",
              "            selection(.automatic)",
              "            return",
              "        }",
              "        let picker = LinkConnectionPickerViewController(",
              "            vehicleText: vehicleText,",
              "            knownAdapterIdentifier: knownAdapterIdentifier) { source in",
              "                Task { @MainActor in selection(source) }",
              "            }",
              "        let navigation = UINavigationController(rootViewController: picker)",
              "        navigation.modalPresentationStyle = .pageSheet",
              "        presenter.present(navigation, animated: true)",
              "    }",
          ]) + "\n"
          new_presentation = "\n".join([
              "enum LinkConnectionPresentation {",
              "    static func presentPicker(",
              "        vehicleText: String,",
              "        knownAdapterIdentifier: String?,",
              "        unavailable: @escaping () -> Void,",
              "        selection: @escaping (LinkConnectionSource) -> Void",
              "    ) {",
              "        presentPicker(",
              "            vehicleText: vehicleText,",
              "            knownAdapterIdentifier: knownAdapterIdentifier,",
              "            remainingPresentationAttempts: 3,",
              "            unavailable: unavailable,",
              "            selection: selection)",
              "    }",
              "",
              "    private static func presentPicker(",
              "        vehicleText: String,",
              "        knownAdapterIdentifier: String?,",
              "        remainingPresentationAttempts: Int,",
              "        unavailable: @escaping () -> Void,",
              "        selection: @escaping (LinkConnectionSource) -> Void",
              "    ) {",
              "        guard let presenter = presentingViewController() else {",
              "            guard remainingPresentationAttempts > 0 else {",
              "                unavailable()",
              "                return",
              "            }",
              "            Task { @MainActor in",
              "                try? await Task<Never, Never>.sleep(",
              "                    nanoseconds: 100_000_000)",
              "                presentPicker(",
              "                    vehicleText: vehicleText,",
              "                    knownAdapterIdentifier: knownAdapterIdentifier,",
              "                    remainingPresentationAttempts:",
              "                        remainingPresentationAttempts - 1,",
              "                    unavailable: unavailable,",
              "                    selection: selection)",
              "            }",
              "            return",
              "        }",
              "        let picker = LinkConnectionPickerViewController(",
              "            vehicleText: vehicleText,",
              "            knownAdapterIdentifier: knownAdapterIdentifier) { source in",
              "                Task { @MainActor in selection(source) }",
              "            }",
              "        let navigation = UINavigationController(rootViewController: picker)",
              "        navigation.modalPresentationStyle = .pageSheet",
              "        presenter.present(navigation, animated: true)",
              "    }",
          ]) + "\n"
          if text.count(old_presentation) != 1:
              raise SystemExit(f'presentation guard failed: {text.count(old_presentation)} matches')
          text = text.replace(old_presentation, new_presentation)
          ui.write_text(text)

          version = Path('VERSION')
          if version.read_text().strip() != '0.15.12':
              raise SystemExit('unexpected LINK VERSION')
          version.write_text('0.15.13\n')

          header = Path('include/link/version.h')
          header_text = header.read_text()
          if header_text.count('#define LINK_VERSION_STRING "0.15.12"') != 1:
              raise SystemExit('version header guard failed')
          header.write_text(header_text.replace(
              '#define LINK_VERSION_STRING "0.15.12"',
              '#define LINK_VERSION_STRING "0.15.13"'))
          PY

          rm .github/workflows/hal-picker-presentation-fix.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Apple picker presentation fallback" -m "Retry briefly when UIKit has not exposed a foreground presenter instead of silently changing an explicit Connect action into automatic adapter discovery. Surface a truthful retry message if presentation remains unavailable, then bump LINK to 0.15.13."
          git push origin HEAD:main
