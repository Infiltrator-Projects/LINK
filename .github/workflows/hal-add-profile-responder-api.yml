name: HAL add profile responder API

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-add-profile-responder-api.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Add typed cached responder API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('platform/apple/LinkDiagnosticsController.h')
          h = hp.read_text()
          marker = '''/** Number of valid standard OBD responder records cached in a profile. */
          FOUNDATION_EXPORT NSUInteger LinkVehicleProfileStandardResponderCount(
              NSDictionary * _Nullable profile);
          '''
          addition = '''/** Product-neutral cached standard OBD responder capability. */
          @interface LinkVehicleProfileStandardResponder : NSObject
          @property(nonatomic, readonly) uint32_t responderCANIdentifier;
          @property(nonatomic, readonly, getter=isExtendedID) BOOL extendedID;
          @property(nonatomic, copy, readonly) NSArray<NSNumber *> *pids;
          @end

          FOUNDATION_EXPORT NSArray<LinkVehicleProfileStandardResponder *> *
          LinkVehicleProfileStandardResponders(NSDictionary * _Nullable profile);

          ''' + marker
          if 'LinkVehicleProfileStandardResponders(' not in h:
              if marker not in h:
                  raise SystemExit('header responder count marker missing')
              h = h.replace(marker, addition, 1)
          hp.write_text(h)

          mp = Path('platform/apple/LinkDiagnosticsController.m')
          m = mp.read_text()
          marker = '''NSUInteger LinkVehicleProfileStandardResponderCount(NSDictionary *profile)
          {
              if (![profile isKindOfClass:[NSDictionary class]]) return 0U;
              NSArray *responders = [profile[@"liveResponders"] isKindOfClass:[NSArray class]]
                  ? profile[@"liveResponders"] : @[];
              NSUInteger count = 0U;
              for (id value in responders) {
                  if ([value isKindOfClass:[NSDictionary class]]) ++count;
              }
              return count;
          }
          '''
          addition = '''@interface LinkVehicleProfileStandardResponder ()
          @property(nonatomic) uint32_t responderCANIdentifier;
          @property(nonatomic, getter=isExtendedID) BOOL extendedID;
          @property(nonatomic, copy) NSArray<NSNumber *> *pids;
          @end

          @implementation LinkVehicleProfileStandardResponder
          @end

          NSArray<LinkVehicleProfileStandardResponder *> *
          LinkVehicleProfileStandardResponders(NSDictionary *profile)
          {
              if (![profile isKindOfClass:[NSDictionary class]]) return @[];
              NSArray *responders = [profile[@"liveResponders"] isKindOfClass:[NSArray class]]
                  ? profile[@"liveResponders"] : @[];
              NSMutableArray<LinkVehicleProfileStandardResponder *> *result =
                  [[NSMutableArray alloc] initWithCapacity:responders.count];
              for (id raw in responders) {
                  if (![raw isKindOfClass:[NSDictionary class]]) continue;
                  NSDictionary *entry = (NSDictionary *)raw;
                  NSNumber *rx = [entry[@"rx"] isKindOfClass:[NSNumber class]]
                      ? entry[@"rx"] : nil;
                  if (rx == nil) continue;
                  BOOL extended = [entry[@"extended"] isKindOfClass:[NSNumber class]]
                      ? [entry[@"extended"] boolValue] : NO;
                  uint32_t responderID = rx.unsignedIntValue;
                  uint32_t maximum = extended ? UINT32_C(0x1fffffff) : UINT32_C(0x7ff);
                  if (responderID > maximum) continue;

                  LinkVehicleProfileStandardResponder *value =
                      [[LinkVehicleProfileStandardResponder alloc] init];
                  value.responderCANIdentifier = responderID;
                  value.extendedID = extended;
                  value.pids = LinkVehicleProfileCachedPIDs(profile, responderID, extended);
                  [result addObject:value];
              }
              return [result copy];
          }

          ''' + marker
          if 'LinkVehicleProfileStandardResponders(NSDictionary *profile)' not in m:
              if marker not in m:
                  raise SystemExit('implementation responder count marker missing')
              m = m.replace(marker, addition, 1)
          mp.write_text(m)
          PY
          git diff --check
      - name: Validate portable LINK suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          rm -rf build
      - name: Publish source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add platform/apple/LinkDiagnosticsController.h platform/apple/LinkDiagnosticsController.m
          git diff --cached --check
          git commit -m "Expose typed cached OBD responder profiles"
          git push origin HEAD:main
